version: 2

seeds:
  - name: seed_synthetic_control_totals
    description: >
      Grain is one row per control-total metric. Natural key is metric_name. Mechanically
      generated by scripts/generate_reconciliation_evidence.py from data/synthetic/
      control_totals.json (itself produced by scripts/generate_control_totals.py) -- never
      hand-typed. data/synthetic/control_totals.json remains the single source-of-truth control
      artifact; this seed exists only because dbt has no native way to query a JSON file directly
      as a source in this project, so the same 14 values are re-expressed here in a tidy long
      format dbt models can join against. Regenerate by re-running
      scripts/generate_reconciliation_evidence.py whenever the synthetic dataset changes.
    columns:
      - name: metric_name
        description: Natural control-total metric identifier and grain key, matching a
          control_totals.json control_totals key exactly.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - booking_cancelled_count
                - booking_confirmed_count
                - booking_count
                - flight_instance_cancelled_count
                - flight_instance_completed_count
                - flight_instance_count
                - flight_instance_scheduled_count
                - invoice_count
                - invoice_total_value
                - refund_count
                - refund_total_value
                - successful_payment_count
                - successful_payment_total_value
                - ticket_count
      - name: metric_value
        description: The control-total value for this metric, unchanged from control_totals.json.
        tests:
          - not_null
      - name: as_of_date
        description: >
          The dataset's fixed synthetic as-of date (control_totals.json's own as_of_date), not a
          wall-clock timestamp.
        tests:
          - not_null
