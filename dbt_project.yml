name: airline_snowflake_dbt_analytics_platform
version: "0.1.0"
config-version: 2

profile: airline_snowflake_dbt_analytics_platform

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  airline_snowflake_dbt_analytics_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    core:
      +materialized: table
      +schema: core
      dimensions:
        +materialized: table
      facts:
        +materialized: table
    marts:
      +materialized: table
      +schema: marts

seeds:
  airline_snowflake_dbt_analytics_platform:
    +schema: seed
    +quote_columns: false

snapshots:
  airline_snowflake_dbt_analytics_platform:
    +target_schema: snapshots

tests:
  airline_snowflake_dbt_analytics_platform:
    +store_failures: false
