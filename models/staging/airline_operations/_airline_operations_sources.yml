version: 2

sources:
  - name: airline_operations
    schema: RAW_AIRLINE_OPERATIONS
    description: >
      Raw airline operations source layer: aircraft, routes, flight schedules, and dated flight
      instances. All rows are deterministic synthetic data produced by
      scripts/generate_airline_data.py (Milestone 9) from data/synthetic/operations/*.csv; no
      live Snowflake ingestion has occurred. Origin/destination airport identifiers are styled
      consistently with the AirStats domain but are not joined to
      source('airstats', 'airports') in this milestone.
    loader: Milestone 9 deterministic synthetic generator (scripts/generate_airline_data.py)
    meta:
      owner: analytics_engineering
      source_provenance: >
        Synthetic data generated by scripts/generate_airline_data.py with fixed seed 20240115
        and synthetic anchor date 2026-01-15. Flight activity is generated in a fixed window
        around that anchor date, not around the real current date.
      raw_data_path: data/synthetic/operations/
      milestone: "9"
      freshness_policy: >
        No dbt source freshness is configured because these are static synthetic generator
        outputs with no genuine ingestion timestamp.
    tables:
      - name: aircraft
        identifier: AIRCRAFT
        description: One row per aircraft (tail). Natural key is aircraft_registration.
        columns:
          - name: aircraft_registration
            description: Natural aircraft tail identifier.
            tests:
              - not_null
              - unique
          - name: airline_code
            description: Operating airline; joins to airline_reference.airlines.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'airlines')
                  field: airline_code
          - name: aircraft_type_code
            description: Aircraft type; joins to airline_reference.aircraft_types.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'aircraft_types')
                  field: aircraft_type_code
          - name: manufactured_year
            description: Synthetic manufacture year for the airframe.

      - name: routes
        identifier: ROUTES
        description: >
          One row per directional airport pair / airline route. Natural key is route_id.
        columns:
          - name: route_id
            description: Natural route identifier.
            tests:
              - not_null
              - unique
          - name: airline_code
            description: Operating airline; joins to airline_reference.airlines.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'airlines')
                  field: airline_code
          - name: origin_ident
            description: >
              Origin airport identifier, styled as an AirStats/OurAirports ident. Future
              conformance target: source('airstats', 'airports').ident.
            tests:
              - not_null
          - name: destination_ident
            description: >
              Destination airport identifier, styled as an AirStats/OurAirports ident. Future
              conformance target: source('airstats', 'airports').ident.
            tests:
              - not_null
          - name: distance_km
            description: Great-circle distance between origin and destination in kilometres.

      - name: flight_schedules
        identifier: FLIGHT_SCHEDULES
        description: >
          One row per scheduled flight service (a template: flight number, local departure time,
          duration, and operating days of week). Natural key is schedule_id.
        columns:
          - name: schedule_id
            description: Natural flight-schedule identifier.
            tests:
              - not_null
              - unique
          - name: route_id
            description: Route this schedule operates; joins to airline_operations.routes.
            tests:
              - not_null
              - relationships:
                  to: source('airline_operations', 'routes')
                  field: route_id
          - name: airline_code
            description: Operating airline; joins to airline_reference.airlines.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'airlines')
                  field: airline_code
          - name: flight_number
            description: Marketing/operating flight number.
          - name: origin_ident
            description: Origin airport identifier (denormalised from the route for convenience).
            tests:
              - not_null
          - name: destination_ident
            description: Destination airport identifier (denormalised from the route for convenience).
            tests:
              - not_null
          - name: aircraft_type_code
            description: Assigned equipment type; joins to airline_reference.aircraft_types.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'aircraft_types')
                  field: aircraft_type_code
          - name: scheduled_departure_local_time
            description: Scheduled local departure time of day (HH:MM) at the origin airport.
          - name: scheduled_duration_minutes
            description: Scheduled flight duration in minutes.
          - name: operating_days_of_week
            description: Pipe-delimited three-letter day-of-week codes the schedule operates on (e.g. MON|WED|FRI).

      - name: flight_instances
        identifier: FLIGHT_INSTANCES
        description: >
          One row per dated flight occurrence. Natural key is flight_instance_id. This dataset
          deliberately contains one flight instance flipped to status='cancelled' after ticketing
          as a controlled exception (see exception_manifest.csv); staging must preserve it as-is.
        columns:
          - name: flight_instance_id
            description: Natural flight-instance identifier.
            tests:
              - not_null
              - unique
          - name: schedule_id
            description: Flight schedule this instance realises; joins to airline_operations.flight_schedules.
            tests:
              - not_null
              - relationships:
                  to: source('airline_operations', 'flight_schedules')
                  field: schedule_id
          - name: flight_number
            description: Flight number (denormalised from the schedule for convenience).
          - name: flight_date
            description: Calendar date of the flight occurrence.
            tests:
              - not_null
          - name: origin_ident
            description: Origin airport identifier (denormalised from the schedule for convenience).
            tests:
              - not_null
          - name: destination_ident
            description: Destination airport identifier (denormalised from the schedule for convenience).
            tests:
              - not_null
          - name: aircraft_registration
            description: Operating aircraft tail; joins to airline_operations.aircraft.
            tests:
              - relationships:
                  to: source('airline_operations', 'aircraft')
                  field: aircraft_registration
          - name: scheduled_departure_utc
            description: Scheduled departure timestamp in UTC.
          - name: scheduled_arrival_utc
            description: Scheduled arrival timestamp in UTC.
          - name: status
            description: >
              Flight-instance status. One row in this dataset is a deliberately injected
              controlled exception (cancelled_flight_without_refund); do not filter it out.
            tests:
              - accepted_values:
                  values:
                    - scheduled
                    - completed
                    - cancelled
