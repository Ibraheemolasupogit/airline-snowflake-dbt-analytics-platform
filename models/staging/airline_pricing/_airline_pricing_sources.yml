version: 2

sources:
  - name: airline_pricing
    schema: RAW_AIRLINE_PRICING
    description: >
      Raw airline products/pricing source layer: products, services, ancillary service sales,
      fare classes, fare rules, airport fees, taxes, and discounts. All rows are deterministic
      synthetic data produced by scripts/generate_airline_data.py (Milestone 9) from
      data/synthetic/pricing/*.csv; no live Snowflake ingestion has occurred. No ticket price or
      invoice charge is calculated in this source or its staging layer.
    loader: Milestone 9 deterministic synthetic generator (scripts/generate_airline_data.py)
    meta:
      owner: analytics_engineering
      source_provenance: >
        Synthetic data generated by scripts/generate_airline_data.py with fixed seed 20240115.
      raw_data_path: data/synthetic/pricing/
      milestone: "9"
      freshness_policy: >
        No dbt source freshness is configured because these are static synthetic generator
        outputs with no genuine ingestion timestamp.
    tables:
      - name: products
        identifier: PRODUCTS
        description: >
          One row per sellable fare bundle. Natural key is product_code.
        columns:
          - name: product_code
            description: Natural product identifier.
            tests:
              - not_null
              - unique
          - name: product_name
            description: Product display name.
          - name: fare_class_code
            description: Underlying fare class the product bundles; joins to airline_pricing.fare_classes.
            tests:
              - not_null
              - relationships:
                  to: source('airline_pricing', 'fare_classes')
                  field: fare_class_code
          - name: included_service_codes
            description: Pipe-delimited service codes included in the bundle (may be blank).

      - name: services
        identifier: SERVICES
        description: One row per sellable ancillary/service catalog entry. Natural key is service_code.
        columns:
          - name: service_code
            description: Natural service identifier.
            tests:
              - not_null
              - unique
          - name: service_name
            description: Service display name.
          - name: category
            description: Service category.
          - name: base_price_usd
            description: Illustrative catalog price in USD, before currency conversion at time of sale.

      - name: ancillary_services
        identifier: ANCILLARY_SERVICES
        description: >
          One row per ancillary service sold against a ticket. Natural key is
          ancillary_service_id. This dataset deliberately contains one
          ancillary_sold_but_not_fulfilled and one ancillary_fulfilled_but_not_billed controlled
          exception; staging must preserve both unchanged.
        columns:
          - name: ancillary_service_id
            description: Natural ancillary-sale identifier.
            tests:
              - not_null
              - unique
          - name: ticket_id
            description: Ticket the ancillary was sold against; joins to airline_bookings.tickets.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'tickets')
                  field: ticket_id
          - name: service_code
            description: Service sold; joins to airline_pricing.services.
            tests:
              - not_null
              - relationships:
                  to: source('airline_pricing', 'services')
                  field: service_code
          - name: quantity
            description: Quantity purchased.
          - name: unit_price
            description: Unit price actually charged, in the ticket's currency.
          - name: currency
            description: Currency of unit_price.
          - name: fulfilment_status
            description: >
              Whether the ancillary was actually delivered. Two rows are deliberately injected
              controlled exceptions; do not filter them out.
            tests:
              - accepted_values:
                  values:
                    - fulfilled
                    - not_fulfilled
                    - pending
          - name: purchase_date_utc
            description: Purchase timestamp in UTC.

      - name: fare_classes
        identifier: FARE_CLASSES
        description: One row per sellable fare class. Natural key is fare_class_code.
        columns:
          - name: fare_class_code
            description: Natural fare class identifier.
            tests:
              - not_null
              - unique
          - name: cabin
            description: Cabin code the fare class sells in.
            tests:
              - accepted_values:
                  values: ["Y", "W", "C", "F"]
          - name: fare_basis_code
            description: Fare basis code.
          - name: refundable
            description: Source-flagged refundability, as 'True'/'False' text from the generator.
          - name: change_fee_usd
            description: Illustrative change fee in USD.
          - name: base_fare_usd
            description: Illustrative base fare component in USD, before distance-based pricing.
          - name: per_km_usd
            description: Illustrative per-kilometre fare rate in USD, used with route distance by the generator.
          - name: description
            description: Fare class display description.

      - name: fare_rules
        identifier: FARE_RULES
        description: One row per fare-class rule set. Natural key is fare_rule_id.
        columns:
          - name: fare_rule_id
            description: Natural fare-rule identifier.
            tests:
              - not_null
              - unique
          - name: fare_class_code
            description: Fare class the rule set applies to; joins to airline_pricing.fare_classes.
            tests:
              - not_null
              - unique
              - relationships:
                  to: source('airline_pricing', 'fare_classes')
                  field: fare_class_code
          - name: refundable
            description: Source-flagged refundability, as 'True'/'False' text from the generator.
          - name: change_fee_usd
            description: Illustrative change fee in USD.
          - name: advance_purchase_days
            description: Minimum advance-purchase requirement in days.
          - name: min_stay_nights
            description: Minimum stay requirement in nights.

      - name: airport_fees
        identifier: AIRPORT_FEES
        description: >
          One row per (airport, fee type). Natural key is airport_fee_id. Airport identifiers are
          styled consistently with the AirStats domain but are not joined to
          source('airstats', 'airports') in this milestone.
        columns:
          - name: airport_fee_id
            description: Natural airport-fee identifier.
            tests:
              - not_null
              - unique
          - name: airport_ident
            description: >
              Airport the fee applies to, AirStats-style. Future conformance target:
              source('airstats', 'airports').ident.
            tests:
              - not_null
          - name: fee_code
            description: Fee type code.
          - name: fee_name
            description: Fee display name.
          - name: currency_code
            description: Currency of amount.
          - name: amount
            description: Illustrative flat fee amount, applied per departing passenger.

      - name: taxes
        identifier: TAXES
        description: One row per (country, tax type). Natural key is tax_id.
        columns:
          - name: tax_id
            description: Natural tax identifier.
            tests:
              - not_null
              - unique
          - name: country_code
            description: ISO country code the tax applies to.
            tests:
              - not_null
          - name: tax_code
            description: Tax type code.
          - name: tax_name
            description: Tax display name.
          - name: percentage_rate
            description: Illustrative tax rate as a fraction of base fare (for example 0.07 = 7%).
          - name: currency_code
            description: Currency the tax is denominated in.

      - name: discounts
        identifier: DISCOUNTS
        description: >
          One row per discount code. Natural key is discount_code. Includes both generic promo
          codes and one corporate-negotiated discount per corporate account.
        columns:
          - name: discount_code
            description: Natural discount identifier.
            tests:
              - not_null
              - unique
          - name: discount_name
            description: Discount display name.
          - name: discount_type
            description: How value should be interpreted.
            tests:
              - accepted_values:
                  values:
                    - percentage
                    - fixed_amount
          - name: value
            description: >
              Discount magnitude. Interpretation depends on discount_type: a fraction (e.g. 0.10)
              when percentage, or a fixed USD amount when fixed_amount.
          - name: corporate_account_id
            description: Corporate account this discount is negotiated for, if any; joins to airline_billing.corporate_accounts.
