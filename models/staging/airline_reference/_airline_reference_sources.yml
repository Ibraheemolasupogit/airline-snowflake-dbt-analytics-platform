version: 2

sources:
  - name: airline_reference
    schema: RAW_AIRLINE_REFERENCE
    description: >
      Raw airline reference source layer: airlines, aircraft types, currencies, and exchange
      rates. All rows are deterministic synthetic data produced by
      scripts/generate_airline_data.py (Milestone 9) from
      data/synthetic/reference/{airlines,aircraft_types,currencies,exchange_rates}.csv; no live
      Snowflake ingestion has occurred. Airport reference data remains owned by the AirStats
      source (source('airstats', 'airports')) and is deliberately not duplicated here.
    loader: Milestone 9 deterministic synthetic generator (scripts/generate_airline_data.py)
    meta:
      owner: analytics_engineering
      source_provenance: >
        Synthetic data generated by scripts/generate_airline_data.py with fixed seed 20240115
        and synthetic anchor date 2026-01-15. Not real airline, passenger, or commercial data.
      raw_data_path: data/synthetic/reference/
      milestone: "9"
      freshness_policy: >
        No dbt source freshness is configured because these are static synthetic generator
        outputs with no genuine ingestion timestamp.
    tables:
      - name: airlines
        identifier: AIRLINES
        description: One row per airline. Natural key is airline_code.
        columns:
          - name: airline_code
            description: Natural airline identifier used throughout the airline domain.
            tests:
              - not_null
              - unique
          - name: airline_name
            description: Airline display name (fictional; not a real airline brand).
          - name: home_country
            description: ISO country code of the airline's home market.
          - name: hub_ident
            description: >
              Hub airport identifier, styled as an AirStats/OurAirports ident. Future
              conformance target: source('airstats', 'airports').ident.

      - name: aircraft_types
        identifier: AIRCRAFT_TYPES
        description: One row per aircraft type. Natural key is aircraft_type_code.
        columns:
          - name: aircraft_type_code
            description: Natural aircraft type identifier.
            tests:
              - not_null
              - unique
          - name: type_name
            description: Manufacturer/model display name.
          - name: body_type
            description: Airframe category.
            tests:
              - accepted_values:
                  values:
                    - narrowbody
                    - widebody
                    - regional
          - name: typical_seats
            description: Typical total seat count for the type.
          - name: cabins
            description: Pipe-delimited ordered list of cabin codes the type supports (e.g. Y|C).
          - name: cruise_speed_kmh
            description: Assumed cruise speed in km/h, used by the generator to derive flight duration.

      - name: currencies
        identifier: CURRENCIES
        description: One row per currency code used anywhere in the airline domain.
        columns:
          - name: currency_code
            description: ISO-style currency code.
            tests:
              - not_null
              - unique
          - name: currency_name
            description: Currency display name.
          - name: minor_unit_digits
            description: Number of minor-unit decimal digits for the currency (for example 2 for USD, 0 for JPY).

      - name: exchange_rates
        identifier: EXCHANGE_RATES
        description: >
          One row per currency, giving a fixed illustrative exchange rate to USD as of the
          synthetic anchor date. These are deterministic fixture rates for relational realism,
          not live market rates.
        columns:
          - name: currency_code
            description: Currency code the rate applies to.
            tests:
              - not_null
              - unique
              - relationships:
                  to: source('airline_reference', 'currencies')
                  field: currency_code
          - name: rate_to_usd
            description: Illustrative fixed rate of one unit of currency_code to USD.
          - name: as_of_date
            description: Synthetic anchor date the rate is dated as of (not a live market date).
