version: 2

sources:
  - name: airline_billing
    schema: RAW_AIRLINE_BILLING
    description: >
      Raw airline billing and payments source layer: corporate accounts, travel agents,
      invoices, invoice lines, payment attempts, payments, refunds, adjustments, credit notes,
      and vouchers. All rows are deterministic synthetic data produced by
      scripts/generate_airline_data.py (Milestone 9) from data/synthetic/billing/*.csv; no live
      Snowflake ingestion has occurred.

      corporate_accounts and travel_agents are grouped here (rather than under
      airline_reference) because they are physically generated into
      data/synthetic/billing/ and are billing counterparties in this dataset; see
      docs/data_models/airline_staging_layer.md for the categorisation note.

      This dataset deliberately contains a documented catalogue of 14 controlled billing/payment
      exceptions (data/synthetic/exception_manifest.csv), including a duplicate invoice, a
      failed-payment-only invoice, an overpaid/unallocated payment, an orphaned payment with no
      invoice, a refund exceeding its collected payment, a late-arriving payment, a missing
      invoice line, a currency mismatch, and an invalid adjustment. Staging must preserve every
      one of them unchanged; no exception-detection logic exists at this layer.
    loader: Milestone 9 deterministic synthetic generator (scripts/generate_airline_data.py)
    meta:
      owner: analytics_engineering
      source_provenance: >
        Synthetic data generated by scripts/generate_airline_data.py with fixed seed 20240115.
      raw_data_path: data/synthetic/billing/
      milestone: "9"
      freshness_policy: >
        No dbt source freshness is configured because these are static synthetic generator
        outputs with no genuine ingestion timestamp.
    tables:
      - name: corporate_accounts
        identifier: CORPORATE_ACCOUNTS
        description: One row per corporate account. Natural key is corporate_account_id.
        columns:
          - name: corporate_account_id
            description: Natural corporate account identifier.
            tests:
              - not_null
              - unique
          - name: company_name
            description: Synthetic company display name.
          - name: country
            description: ISO country code of the corporate account.
          - name: negotiated_discount_pct
            description: Negotiated discount rate as a fraction (e.g. 0.12 = 12%).
          - name: default_currency
            description: Default billing currency for the account.

      - name: travel_agents
        identifier: TRAVEL_AGENTS
        description: One row per travel agent. Natural key is travel_agent_id.
        columns:
          - name: travel_agent_id
            description: Natural travel agent identifier.
            tests:
              - not_null
              - unique
          - name: agency_name
            description: Synthetic agency display name.
          - name: iata_number
            description: Synthetic IATA-style agency number.
          - name: country
            description: ISO country code of the agency.
          - name: commission_pct
            description: Commission rate as a fraction (e.g. 0.07 = 7%).

      - name: invoices
        identifier: INVOICES
        description: >
          One row per invoice. Natural key is invoice_id. This dataset deliberately contains one
          duplicate invoice (a second invoice_id for the same booking_id), one invoice with a
          missing invoice line versus its header total, and other controlled exceptions;
          staging must preserve all of them unchanged.
        columns:
          - name: invoice_id
            description: Natural invoice identifier.
            tests:
              - not_null
              - unique
          - name: booking_id
            description: >
              Booking this invoice bills; joins to airline_bookings.bookings. Not unique -- the
              deliberately injected duplicate-invoice exception means one booking_id appears on
              two invoice_id values.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'bookings')
                  field: booking_id
          - name: invoice_date_utc
            description: Invoice creation timestamp in UTC.
          - name: currency
            description: Invoice currency.
          - name: bill_to_type
            description: Who the invoice is billed to.
            tests:
              - accepted_values:
                  values:
                    - passenger
                    - corporate
                    - travel_agent
          - name: bill_to_id
            description: Identifier of the passenger, corporate account, or travel agent billed, depending on bill_to_type.
          - name: subtotal_amount
            description: Sum of base_fare invoice lines.
          - name: tax_amount
            description: Sum of tax invoice lines.
          - name: fee_amount
            description: Sum of airport_fee invoice lines.
          - name: ancillary_amount
            description: Sum of ancillary invoice lines.
          - name: discount_amount
            description: Discount applied, as a positive magnitude.
          - name: total_amount
            description: >
              Invoice header total. One invoice's total_amount is a deliberately injected
              controlled exception and no longer reconciles to sum(invoice_lines.amount); do not
              correct it here.
          - name: status
            description: Invoice status.
            tests:
              - accepted_values:
                  values:
                    - issued
                    - paid
                    - refunded
                    - cancelled

      - name: invoice_lines
        identifier: INVOICE_LINES
        description: >
          One row per invoice charge component. Natural key is invoice_line_id. Amounts here are
          preserved exactly as generated, including deliberately incorrect and deliberately
          missing lines documented in exception_manifest.csv.
        columns:
          - name: invoice_line_id
            description: Natural invoice-line identifier.
            tests:
              - not_null
              - unique
          - name: invoice_id
            description: Invoice this line belongs to; joins to airline_billing.invoices.
            tests:
              - not_null
              - relationships:
                  to: source('airline_billing', 'invoices')
                  field: invoice_id
          - name: ticket_id
            description: Ticket this line relates to, if applicable (blank for booking-level discount lines).
          - name: line_type
            description: Type of charge component.
            tests:
              - accepted_values:
                  values:
                    - base_fare
                    - tax
                    - airport_fee
                    - ancillary
                    - discount
          - name: reference_code
            description: Code of the underlying fare class, tax, fee, service, or discount this line represents.
          - name: description
            description: Human-readable line description.
          - name: amount
            description: >
              Line amount. One row's amount is a deliberately injected incorrect_fare controlled
              exception; do not correct it here.
          - name: currency
            description: Line currency.

      - name: payment_attempts
        identifier: PAYMENT_ATTEMPTS
        description: One row per payment attempt. Natural key is payment_attempt_id.
        columns:
          - name: payment_attempt_id
            description: Natural payment-attempt identifier.
            tests:
              - not_null
              - unique
          - name: invoice_id
            description: Invoice the attempt is for; joins to airline_billing.invoices.
            tests:
              - not_null
              - relationships:
                  to: source('airline_billing', 'invoices')
                  field: invoice_id
          - name: attempt_datetime_utc
            description: Attempt timestamp in UTC.
          - name: method
            description: Payment method attempted.
          - name: amount
            description: Amount attempted.
          - name: currency
            description: Currency of amount.
          - name: result
            description: Outcome of the attempt.
            tests:
              - accepted_values:
                  values:
                    - success
                    - failed
          - name: failure_reason
            description: Failure reason, populated only when result='failed'.

      - name: payments
        identifier: PAYMENTS
        description: >
          One row per successful payment transaction. Natural key is payment_id. This dataset
          deliberately contains one orphaned payment referencing a non-existent invoice_id, one
          overpaid/unallocated payment, one late-arriving payment, and one currency-mismatched
          payment; staging must preserve all of them unchanged.
        columns:
          - name: payment_id
            description: Natural payment identifier.
            tests:
              - not_null
              - unique
          - name: payment_attempt_id
            description: >
              Originating payment attempt; joins to airline_billing.payment_attempts. Blank for
              the deliberately injected payment_without_invoice exception row, which has no
              corresponding attempt.
          - name: invoice_id
            description: >
              Invoice this payment is for. One row deliberately references a non-existent
              invoice_id ('INV-99999') as a controlled payment_without_invoice exception; no
              relationship test is applied at the source layer for this reason.
            tests:
              - not_null
          - name: payment_datetime_utc
            description: Payment timestamp in UTC.
          - name: method
            description: Payment method used.
          - name: amount
            description: >
              Amount collected. One row's amount deliberately exceeds its invoice total as a
              controlled unallocated_payment exception; do not correct it here.
          - name: currency
            description: >
              Currency of amount. One row deliberately differs from its invoice's currency as a
              controlled currency_mismatch exception.
          - name: allocation_status
            description: Allocation status of the payment against its invoice.
            tests:
              - accepted_values:
                  values:
                    - fully_allocated
                    - overpaid_unallocated
                    - unallocated

      - name: refunds
        identifier: REFUNDS
        description: >
          One row per refund transaction. Natural key is refund_id. This dataset deliberately
          contains one refund whose amount exceeds the amount collected on its linked payment;
          staging must preserve it unchanged.
        columns:
          - name: refund_id
            description: Natural refund identifier.
            tests:
              - not_null
              - unique
          - name: invoice_id
            description: Invoice the refund relates to; joins to airline_billing.invoices.
            tests:
              - not_null
              - relationships:
                  to: source('airline_billing', 'invoices')
                  field: invoice_id
          - name: booking_id
            description: Booking the refund relates to; joins to airline_bookings.bookings.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'bookings')
                  field: booking_id
          - name: payment_id
            description: Original payment being refunded; joins to airline_billing.payments.
            tests:
              - relationships:
                  to: source('airline_billing', 'payments')
                  field: payment_id
          - name: refund_datetime_utc
            description: Refund timestamp in UTC.
          - name: reason
            description: Refund reason.
          - name: amount
            description: >
              Refund amount. One row deliberately exceeds the amount collected on its linked
              payment as a controlled refund_greater_than_collected_amount exception; do not
              correct it here.
          - name: currency
            description: Refund currency.
          - name: method
            description: Refund method.
          - name: status
            description: Refund status.
            tests:
              - accepted_values:
                  values:
                    - issued
                    - pending

      - name: adjustments
        identifier: ADJUSTMENTS
        description: >
          One row per manual invoice adjustment. Natural key is adjustment_id. This dataset
          deliberately contains one adjustment referencing a non-existent invoice_id with an
          implausibly large amount as a controlled invalid_adjustment exception; staging must
          preserve it unchanged.
        columns:
          - name: adjustment_id
            description: Natural adjustment identifier.
            tests:
              - not_null
              - unique
          - name: invoice_id
            description: >
              Invoice the adjustment relates to. One row deliberately references a non-existent
              invoice_id ('INV-99998') as a controlled invalid_adjustment exception; no
              relationship test is applied at the source layer for this reason.
            tests:
              - not_null
          - name: adjustment_type
            description: Adjustment direction.
            tests:
              - accepted_values:
                  values:
                    - credit
                    - debit
          - name: amount
            description: Adjustment amount (negative for credits in this dataset's convention).
          - name: currency
            description: Adjustment currency.
          - name: reason
            description: Adjustment reason.
          - name: created_at_utc
            description: Adjustment creation timestamp in UTC.

      - name: credit_notes
        identifier: CREDIT_NOTES
        description: One row per credit note. Natural key is credit_note_id.
        columns:
          - name: credit_note_id
            description: Natural credit-note identifier.
            tests:
              - not_null
              - unique
          - name: invoice_id
            description: Invoice the credit note relates to; joins to airline_billing.invoices.
            tests:
              - not_null
              - relationships:
                  to: source('airline_billing', 'invoices')
                  field: invoice_id
          - name: refund_id
            description: Refund the credit note evidences, if any; joins to airline_billing.refunds.
          - name: adjustment_id
            description: Adjustment the credit note evidences, if any; joins to airline_billing.adjustments.
          - name: amount
            description: Credit note amount.
          - name: currency
            description: Credit note currency.
          - name: issued_at_utc
            description: Issuance timestamp in UTC.
          - name: status
            description: Credit note status.
            tests:
              - accepted_values:
                  values:
                    - issued

      - name: vouchers
        identifier: VOUCHERS
        description: One row per issued travel voucher. Natural key is voucher_id.
        columns:
          - name: voucher_id
            description: Natural voucher identifier.
            tests:
              - not_null
              - unique
          - name: passenger_id
            description: Passenger the voucher was issued to; joins to airline_bookings.passengers.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'passengers')
                  field: passenger_id
          - name: issued_from
            description: Reason the voucher was issued.
          - name: amount
            description: Voucher amount.
          - name: currency
            description: Voucher currency.
          - name: issued_at_utc
            description: Issuance timestamp in UTC.
          - name: expiry_date
            description: Voucher expiry date.
          - name: status
            description: Voucher status.
            tests:
              - accepted_values:
                  values:
                    - active
          - name: redeemed_booking_id
            description: Booking the voucher was redeemed against, if any; joins to airline_bookings.bookings.
