version: 2

sources:
  - name: airline_bookings
    schema: RAW_AIRLINE_BOOKINGS
    description: >
      Raw airline booking and ticketing source layer: passengers, bookings, booking-passenger
      associations, tickets, and ticket segments. All rows are deterministic synthetic data
      produced by scripts/generate_airline_data.py (Milestone 9) from
      data/synthetic/bookings/*.csv; no live Snowflake ingestion has occurred. No real
      passenger or booking data is present anywhere in this source.
    loader: Milestone 9 deterministic synthetic generator (scripts/generate_airline_data.py)
    meta:
      owner: analytics_engineering
      source_provenance: >
        Synthetic data generated by scripts/generate_airline_data.py with fixed seed 20240115.
        Passenger names are drawn from a small fixed word-list; emails use the .invalid TLD
        reserved by RFC 2606 so they can never resolve to a real mailbox.
      raw_data_path: data/synthetic/bookings/
      milestone: "9"
      freshness_policy: >
        No dbt source freshness is configured because these are static synthetic generator
        outputs with no genuine ingestion timestamp.
    tables:
      - name: passengers
        identifier: PASSENGERS
        description: >
          One row per synthetic passenger. Natural key is passenger_id. All names, dates of
          birth, and emails are synthetic; no real individuals are represented.
        columns:
          - name: passenger_id
            description: Natural passenger identifier.
            tests:
              - not_null
              - unique
          - name: first_name
            description: Synthetic first name.
          - name: last_name
            description: Synthetic last name.
          - name: date_of_birth
            description: Synthetic date of birth.
          - name: nationality
            description: Synthetic ISO country code.
          - name: email
            description: Synthetic email address on the .invalid reserved test domain.
          - name: loyalty_tier
            description: Synthetic loyalty program tier.

      - name: bookings
        identifier: BOOKINGS
        description: >
          One row per booking reference. Natural key is booking_id. This dataset deliberately
          contains one duplicate-invoice exception and a small number of cancelled bookings used
          by other controlled exceptions; staging must preserve all of them unchanged.
        columns:
          - name: booking_id
            description: Natural booking identifier.
            tests:
              - not_null
              - unique
          - name: booking_reference
            description: Passenger-facing booking reference code (PNR-style).
            tests:
              - not_null
          - name: airline_code
            description: Operating/marketing airline; joins to airline_reference.airlines.
            tests:
              - not_null
              - relationships:
                  to: source('airline_reference', 'airlines')
                  field: airline_code
          - name: route_id
            description: Outbound route; joins to airline_operations.routes.
            tests:
              - not_null
              - relationships:
                  to: source('airline_operations', 'routes')
                  field: route_id
          - name: return_route_id
            description: Return route for round-trip bookings; joins to airline_operations.routes. Blank for one-way bookings.
          - name: trip_type
            description: Trip type.
            tests:
              - accepted_values:
                  values:
                    - one_way
                    - round_trip
          - name: booking_channel
            description: Sales channel the booking was made through.
          - name: booking_date_utc
            description: Booking creation timestamp in UTC.
          - name: point_of_sale_country
            description: ISO country code of the point of sale, used to derive the booking currency.
          - name: currency
            description: Currency code for this booking's invoice/payments.
          - name: status
            description: Booking status.
            tests:
              - accepted_values:
                  values:
                    - confirmed
                    - cancelled
          - name: corporate_account_id
            description: Corporate account, if this is a corporate booking; joins to airline_billing.corporate_accounts.
          - name: travel_agent_id
            description: Travel agent, if this booking was made through an agent; joins to airline_billing.travel_agents.
          - name: discount_code
            description: Discount code applied, if any; joins to airline_pricing.discounts.
          - name: outbound_flight_instance_id
            description: Outbound flight instance; joins to airline_operations.flight_instances.
            tests:
              - not_null
              - relationships:
                  to: source('airline_operations', 'flight_instances')
                  field: flight_instance_id
          - name: return_flight_instance_id
            description: Return flight instance for round-trip bookings; joins to airline_operations.flight_instances.

      - name: booking_passengers
        identifier: BOOKING_PASSENGERS
        description: One row per booking-passenger association. Natural key is booking_passenger_id.
        columns:
          - name: booking_passenger_id
            description: Natural booking-passenger association identifier.
            tests:
              - not_null
              - unique
          - name: booking_id
            description: Booking the passenger is associated with; joins to airline_bookings.bookings.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'bookings')
                  field: booking_id
          - name: passenger_id
            description: Passenger associated with the booking; joins to airline_bookings.passengers.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'passengers')
                  field: passenger_id
          - name: passenger_type
            description: Passenger fare type.
            tests:
              - accepted_values:
                  values:
                    - adult
                    - child
                    - infant
          - name: seq_in_booking
            description: 1-based ordering of the passenger within the booking.

      - name: tickets
        identifier: TICKETS
        description: >
          One row per issued passenger ticket. Natural key is ticket_id. One row's base-fare
          amount is a deliberately injected controlled exception at the invoice_lines layer, not
          here; this table itself is not directly mutated by that exception.
        columns:
          - name: ticket_id
            description: Natural ticket identifier.
            tests:
              - not_null
              - unique
          - name: ticket_number
            description: Synthetic airline-style ticket number.
            tests:
              - not_null
          - name: booking_id
            description: Booking this ticket belongs to; joins to airline_bookings.bookings.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'bookings')
                  field: booking_id
          - name: passenger_id
            description: Passenger this ticket is issued to; joins to airline_bookings.passengers.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'passengers')
                  field: passenger_id
          - name: fare_class_code
            description: Fare class purchased; joins to airline_pricing.fare_classes.
            tests:
              - not_null
              - relationships:
                  to: source('airline_pricing', 'fare_classes')
                  field: fare_class_code
          - name: issue_date_utc
            description: Ticket issue timestamp in UTC.
          - name: ticket_status
            description: Ticket status.
            tests:
              - accepted_values:
                  values:
                    - issued
                    - cancelled

      - name: ticket_segments
        identifier: TICKET_SEGMENTS
        description: >
          One row per ticketed passenger flight segment. Natural key is ticket_segment_id. One
          segment is a deliberately injected controlled exception
          (completed_segment_without_recognised_revenue_precursor); staging must preserve it
          unchanged.
        columns:
          - name: ticket_segment_id
            description: Natural ticket-segment identifier.
            tests:
              - not_null
              - unique
          - name: ticket_id
            description: Ticket this segment belongs to; joins to airline_bookings.tickets.
            tests:
              - not_null
              - relationships:
                  to: source('airline_bookings', 'tickets')
                  field: ticket_id
          - name: segment_sequence
            description: 1-based ordering of the segment within the ticket.
          - name: flight_instance_id
            description: Flight instance this segment is booked on; joins to airline_operations.flight_instances.
            tests:
              - not_null
              - relationships:
                  to: source('airline_operations', 'flight_instances')
                  field: flight_instance_id
          - name: cabin
            description: Cabin code for this segment.
            tests:
              - accepted_values:
                  values:
                    - Y
                    - W
                    - C
                    - F
          - name: fare_basis_code
            description: Fare basis code for this segment.
          - name: segment_status
            description: >
              Segment status, used by later milestones to determine fulfilment. One row is a
              deliberately injected controlled exception; do not filter it out.
            tests:
              - accepted_values:
                  values:
                    - confirmed
                    - flown
                    - cancelled
