version: 2

models:
  - name: int_invoice_status
    description: >
      Current-state invoice status model. Grain is one row per invoice. Primary key is invoice_id.
      Upstream model is stg_airline__invoices. Named "status" not "status_history" because the
      source has no status-change history table -- only a current status column, matching
      int_booking_current_state's (Milestone 12) precedent. status values already partially
      reflect payment/refund outcomes baked into the Milestone 9 generator; no new payment-based
      logic is derived here.
    columns:
      - name: invoice_id
        description: Natural invoice identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: status
        description: Current invoice status, unchanged from source.
        tests:
          - accepted_values:
              values:
                - issued
                - paid
                - refunded
                - cancelled
      - name: is_cancelled
        description: True when status = 'cancelled'.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: int_invoice_calculation
    description: >
      Deterministic invoice arithmetic control. Grain is one row per invoice. Primary key is
      invoice_id. Upstream models are stg_airline__invoices and stg_airline__invoice_lines. Purely
      an internal source-to-source reconciliation (header vs. its own lines) -- independent of
      Milestone 13 pricing; see int_invoice_charge_comparison for the separate pricing-vs-invoice
      control. See model SQL comment for the sign convention and the exact discount-amount
      relationship.
    columns:
      - name: invoice_id
        description: Natural invoice identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: booking_id
        description: Booking this invoice bills. Deliberately not unique (duplicate_invoice).
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__bookings')
              field: booking_id
      - name: currency
        description: Invoice currency.
        tests:
          - relationships:
              to: ref('stg_airline__currencies')
              field: currency_code
      - name: source_invoice_total
        description: invoices.total_amount, unchanged from source. Never overwritten.
      - name: line_count
        description: Count of stg_airline__invoice_lines rows for this invoice.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: calculated_invoice_line_total
        description: >
          sum(invoice_lines.amount) for this invoice, using the actual invoice-line sign
          convention (discount lines already negative). Kept alongside source_invoice_total, never
          overwriting it, so later assurance can compare them.
        tests:
          - not_null
      - name: invoice_total_variance
        description: >
          source_invoice_total - calculated_invoice_line_total. Nonzero for the deliberately
          injected missing_invoice_line, incorrect_fare, and completed_segment_without_recognised_
          revenue_precursor controlled exceptions (see docs/data_models/airline_synthetic_
          exception_catalogue.md); this model does not repair or classify that condition.
        tests:
          - not_null

  - name: int_invoice_charge_comparison
    description: >
      Pricing-vs-invoice comparison evidence. Grain is one row per (invoice_id,
      comparable_line_type, reference_code, ticket_id) -- ticket_id is null only for the
      booking-scoped discount type. Upstream models are fct_pricing_events (Milestone 13),
      stg_airline__invoices, stg_airline__tickets, and stg_airline__invoice_lines. Exposes
      comparison evidence only -- no billing-exception classification. See model SQL comment for
      the comparable_line_type bucket mapping, the reference_code alignment, and the sign
      convention.
    columns:
      - name: invoice_id
        description: Invoice this comparison row is evidence for.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: comparable_line_type
        description: Bucketed component/line type this row compares.
        tests:
          - not_null
          - accepted_values:
              values:
                - base_fare
                - tax
                - airport_fee
                - ancillary
                - discount
      - name: ticket_id
        description: Ticket this comparison row is scoped to; null only for the discount type.
        tests:
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: expected_amount
        description: >
          Sum of fct_pricing_events.amount for this (ticket/booking, comparable_line_type,
          reference_code); null when no matching pricing component exists.
      - name: invoiced_amount
        description: >
          Sum of stg_airline__invoice_lines.amount for this (invoice, ticket, line_type,
          reference_code); null when no matching invoice line exists.
      - name: variance_amount
        description: >
          invoiced_amount - expected_amount (nulls treated as 0 for this subtraction only).
          Positive means the invoice charged more than expected; negative means less, including a
          component missing entirely from the invoice.
        tests:
          - not_null

  - name: int_invoice_line_validation
    description: >
      Structural validation of invoice lines. Grain is one row per invoice line. Primary key is
      invoice_line_id. Upstream models are stg_airline__invoice_lines, stg_airline__invoices, and
      fct_pricing_events. Adds structural validation SIGNALS only (has_invoice_parent,
      has_supported_line_type, has_currency, has_non_null_amount,
      expected_pricing_component_available) -- not billing-exception classifications.
    columns:
      - name: invoice_line_id
        description: Natural invoice-line identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__invoice_lines')
              field: invoice_line_id
      - name: invoice_id
        description: Invoice this line belongs to.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: ticket_id
        description: Ticket this line relates to; null for booking-level discount lines.
        tests:
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: line_type
        description: Type of charge component, unchanged from source.
        tests:
          - accepted_values:
              values:
                - base_fare
                - tax
                - airport_fee
                - ancillary
                - discount
      - name: currency
        description: Line currency.
        tests:
          - relationships:
              to: ref('stg_airline__currencies')
              field: currency_code
      - name: has_invoice_parent
        description: Validation signal -- true when invoice_id resolves to a real invoice.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_supported_line_type
        description: Validation signal -- true when line_type is one of the five known types.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_currency
        description: Validation signal -- true when currency is not null.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_non_null_amount
        description: Validation signal -- true when amount is not null.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: expected_pricing_component_available
        description: >
          Validation signal -- true when a matching fct_pricing_events component exists for this
          line's (ticket/booking, line_type, reference_code). False does not by itself mean the
          line is wrong; see int_invoice_charge_comparison for the actual amount comparison.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: int_payment_attempt_classification
    description: >
      Deterministic payment-attempt classification. Grain is one row per payment attempt. Primary
      key is payment_attempt_id. Upstream models are stg_airline__payment_attempts and
      stg_airline__invoices (booking_id only). See model SQL comment for why 'pending' is not used
      as an attempt_classification value and for the classified_failure_reason bucketing rule.
    columns:
      - name: payment_attempt_id
        description: Natural payment-attempt identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__payment_attempts')
              field: payment_attempt_id
      - name: invoice_id
        description: Invoice the attempt is for.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: currency
        description: Currency of amount.
        tests:
          - relationships:
              to: ref('stg_airline__currencies')
              field: currency_code
      - name: method
        description: Payment method attempted.
        tests:
          - accepted_values:
              values:
                - card
                - bank_transfer
                - voucher
      - name: amount
        description: Amount attempted.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: attempt_classification
        description: >
          Deterministic classification derived from result. 'pending' is deliberately not a
          possible value -- see model SQL comment.
        tests:
          - not_null
          - accepted_values:
              values:
                - successful
                - failed
                - other
      - name: classified_failure_reason
        description: >
          Bucketed raw_failure_reason; null for successful attempts. See model SQL comment for the
          bucketing rule and why 'expired'/'reversed'/'incomplete' are not used.
        tests:
          - accepted_values:
              values:
                - declined
                - insufficient_funds
                - other

  - name: int_failed_payment_attempts
    description: >
      Grain is one row per failed payment attempt. Primary key is payment_attempt_id. Filters
      int_payment_attempt_classification to attempt_classification = 'failed'. Evidence only -- not
      a billing-exception classification.
    columns:
      - name: payment_attempt_id
        description: Natural payment-attempt identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_payment_attempt_classification')
              field: payment_attempt_id

  - name: int_invoice_payment_matching
    description: >
      Grain is one row per payment transaction. Primary key is payment_id. Upstream models are
      stg_airline__payments and stg_airline__invoices, LEFT JOINed so an unmatched payment
      (payment_without_invoice) is preserved, not dropped. See model SQL comment for the
      is_currency_match and payment_delay_days semantics.
    columns:
      - name: payment_id
        description: Natural payment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__payments')
              field: payment_id
      - name: has_invoice_match
        description: True when invoice_id resolves to a real invoice.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: >
          True when transaction_currency equals invoice_currency; null when there is no invoice to
          compare against (has_invoice_match = false). No conversion is attempted.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: match_status
        description: Either matched or unmatched_invoice_missing.
        tests:
          - not_null
          - accepted_values:
              values:
                - matched
                - unmatched_invoice_missing

  - name: int_payment_allocation
    description: >
      Grain is one row per payment-to-invoice allocation (identical to payment_id in this
      dataset -- see model SQL comment for why). Primary key is payment_id. Upstream models are
      int_invoice_payment_matching and stg_airline__invoices (total_amount only).
    columns:
      - name: payment_id
        description: Natural payment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_invoice_payment_matching')
              field: payment_id
      - name: allocated_amount
        description: least(payment_amount, invoice total_amount) when matched, else 0.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
          - dbt_utils.expression_is_true:
              expression: "<= payment_amount"
      - name: unallocated_amount
        description: payment_amount - allocated_amount.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: int_unallocated_payments
    description: >
      Grain is one row per payment with a positive unallocated amount. Primary key is payment_id.
      Filters int_payment_allocation to unallocated_amount > 0. Evidence only -- not a
      billing-exception classification.
    columns:
      - name: payment_id
        description: Natural payment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_payment_allocation')
              field: payment_id
      - name: unallocated_amount
        description: Always positive at this model's grain.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: int_refund_payment_matching
    description: >
      Grain is one row per refund. Primary key is refund_id. Upstream models are
      stg_airline__refunds and stg_airline__payments, LEFT JOINed on payment_id so an unmatched
      refund would be preserved, not dropped (none currently occurs in this dataset -- see model
      SQL comment).
    columns:
      - name: refund_id
        description: Natural refund identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__refunds')
              field: refund_id
      - name: invoice_id
        description: Invoice the refund relates to, preserved directly from stg_airline__refunds.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: booking_id
        description: Booking the refund relates to, preserved directly from stg_airline__refunds.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__bookings')
              field: booking_id
      - name: has_payment_match
        description: True when payment_id resolves to a real payment.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: >
          True when refund_currency equals payment_currency; null when there is no matched
          payment to compare against.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: int_refund_allocation
    description: >
      Grain is one row per refund. Primary key is refund_id. Upstream model is
      int_refund_payment_matching. Exposes refund-limit calculation evidence only -- see model SQL
      comment for the exact formula and for why refundable_amount_reference is the matched
      payment's amount, not an invoice-level aggregate.
    columns:
      - name: refund_id
        description: Natural refund identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_refund_payment_matching')
              field: refund_id
      - name: refund_amount
        description: Refund amount, unchanged from source. One row carries the deliberately
          injected refund_greater_than_collected_amount controlled exception.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: refund_limit_variance
        description: >
          refund_amount - refundable_amount_reference. Positive means the refund exceeds the
          amount collected on its matched payment. Calculation evidence only, not a
          billing-exception classification.

  - name: int_adjustment_allocation
    description: >
      Grain is one row per adjustment. Primary key is adjustment_id. Upstream models are
      stg_airline__adjustments and stg_airline__invoices, LEFT JOINed so the deliberately injected
      invalid_adjustment controlled exception (invoice_id does not resolve) is preserved, not
      dropped. See model SQL comment for the verified sign convention.
    columns:
      - name: adjustment_id
        description: Natural adjustment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__adjustments')
              field: adjustment_id
      - name: adjustment_type
        description: Adjustment direction, unchanged from source.
        tests:
          - accepted_values:
              values:
                - credit
                - debit
      - name: has_invoice_match
        description: True when invoice_id resolves to a real invoice.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_supported_adjustment_type
        description: True when adjustment_type is one of the two known values.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: >
          True when currency equals the matched invoice's currency; null when unmatched.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_expected_sign_for_type
        description: >
          True when a 'credit' adjustment's amount is <= 0, or a 'debit' adjustment's amount is
          >= 0. False for the deliberately injected invalid_adjustment exception (a 'credit'
          adjustment with a positive amount). Structural evidence only, not a billing-exception
          classification.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: int_credit_note_application
    description: >
      Grain is one row per credit note. Primary key is credit_note_id. Upstream models are
      stg_airline__credit_notes and stg_airline__invoices. A credit note in this dataset is a
      paper-trail document evidencing a refund, not an independent invoice-application instrument
      -- see model SQL comment for why no allocation rule is invented here.
    columns:
      - name: credit_note_id
        description: Natural credit-note identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__credit_notes')
              field: credit_note_id
      - name: has_refund_link
        description: True when refund_id is populated. Always true in the current dataset.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_adjustment_link
        description: >
          True when adjustment_id is populated. Always false in the current dataset -- see model
          SQL comment.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
