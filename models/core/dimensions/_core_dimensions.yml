version: 2

models:
  - name: dim_airport
    description: >
      The first true conformed airport dimension. Grain is one row per current airport
      identifier. Natural key is airport_ident; surrogate key is airport_key
      (dbt_utils.generate_surrogate_key(['airport_ident'])). AirStats is the sole authoritative
      source, reused via mart_airport_geographic_coverage and mart_airport_capacity_profile; the
      synthetic reference/airports.csv fixture is never joined here. This is a current-state
      dimension (no history); AirStats' own snap_airports/snap_runways snapshots remain the
      place for SCD Type 2 airport history.
    columns:
      - name: airport_key
        description: Surrogate key, generated from airport_ident.
        tests:
          - not_null
          - unique
      - name: airport_ident
        description: Natural airport identifier, conformed from AirStats.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airstats__airports')
              field: ident
      - name: airport_name
        description: Airport name from the AirStats conformed layer.
      - name: airport_type
        description: Source airport type from the AirStats conformed layer.
      - name: country_code
        description: Country code from the AirStats conformed layer.
      - name: country_name
        description: Country name from the AirStats conformed layer.
      - name: region_code
        description: Region code from the AirStats conformed layer.
      - name: region_name
        description: Region name from the AirStats conformed layer.
      - name: municipality
        description: Municipality from the AirStats conformed layer.
      - name: continent_code
        description: Continent code from the AirStats conformed layer.
      - name: latitude_deg
        description: Latitude from the AirStats conformed layer.
      - name: longitude_deg
        description: Longitude from the AirStats conformed layer.
      - name: elevation_ft
        description: Elevation from the AirStats conformed layer.
      - name: gps_code
        description: GPS code from the AirStats conformed layer.
      - name: icao_code
        description: ICAO code from the AirStats conformed layer.
      - name: iata_code
        description: IATA code from the AirStats conformed layer.
      - name: local_code
        description: Local code from the AirStats conformed layer.
      - name: has_scheduled_service
        description: Source-derived scheduled-service flag from the AirStats conformed layer.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: runway_count
        description: Count of staged AirStats runway records for the airport.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: open_runway_count
        description: Count of staged AirStats runway records whose source closed flag is false.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_airline
    description: >
      Grain is one row per airline. Natural key is airline_code; surrogate key is airline_key.
      Validates each airline's hub airport against dim_airport via hub_airport_key, which is the
      concrete evidence (not just documentation) that AirStats airport identifiers are genuinely
      integrated into the airline domain.
    columns:
      - name: airline_key
        description: Surrogate key, generated from airline_code.
        tests:
          - not_null
          - unique
      - name: airline_code
        description: Natural airline identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__airlines')
              field: airline_code
      - name: airline_name
        description: Airline display name (synthetic, fictional).
      - name: home_country
        description: ISO country code of the airline's home market.
      - name: hub_ident
        description: Hub airport identifier, AirStats-conformed.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_ident
      - name: hub_airport_key
        description: Surrogate key of the hub airport in dim_airport.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key

  - name: dim_aircraft_type
    description: >
      Grain is one row per aircraft type. Natural key is aircraft_type_code; surrogate key is
      aircraft_type_key.
    columns:
      - name: aircraft_type_key
        description: Surrogate key, generated from aircraft_type_code.
        tests:
          - not_null
          - unique
      - name: aircraft_type_code
        description: Natural aircraft type identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__aircraft_types')
              field: aircraft_type_code
      - name: type_name
        description: Manufacturer/model display name.
      - name: body_type
        description: Airframe category.
        tests:
          - accepted_values:
              values:
                - narrowbody
                - widebody
                - regional
      - name: typical_seats
        description: Typical total seat count for the type.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              row_condition: typical_seats is not null
      - name: cabins
        description: Pipe-delimited ordered list of cabin codes the type supports.
      - name: cruise_speed_kmh
        description: Assumed cruise speed in km/h.

  - name: dim_aircraft
    description: >
      Grain is one row per aircraft registration. Natural key is aircraft_registration;
      surrogate key is aircraft_key.
    columns:
      - name: aircraft_key
        description: Surrogate key, generated from aircraft_registration.
        tests:
          - not_null
          - unique
      - name: aircraft_registration
        description: Natural aircraft tail identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__aircraft')
              field: aircraft_registration
      - name: airline_key
        description: Surrogate key of the operating airline in dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: airline_code
        description: Operating airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_code
      - name: aircraft_type_key
        description: Surrogate key of the aircraft type in dim_aircraft_type.
        tests:
          - not_null
          - relationships:
              to: ref('dim_aircraft_type')
              field: aircraft_type_key
      - name: aircraft_type_code
        description: Aircraft type.
        tests:
          - not_null
          - relationships:
              to: ref('dim_aircraft_type')
              field: aircraft_type_code
      - name: manufactured_year
        description: Synthetic manufacture year for the airframe.

  - name: dim_route
    description: >
      Grain is one row per airline route. Natural key is route_id; surrogate key is route_key.
      Origin and destination use conformed dim_airport keys, proving the airline route layer is
      genuinely joined to AirStats rather than merely documented as compatible with it.
    columns:
      - name: route_key
        description: Surrogate key, generated from route_id.
        tests:
          - not_null
          - unique
      - name: route_id
        description: Natural route identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_route_airport_pair')
              field: route_id
      - name: airline_key
        description: Surrogate key of the operating airline in dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: airline_code
        description: Operating airline.
        tests:
          - not_null
      - name: origin_airport_key
        description: Surrogate key of the origin airport in dim_airport.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: origin_ident
        description: Origin airport identifier, AirStats-conformed.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_ident
      - name: origin_airport_name
        description: Origin airport name.
      - name: destination_airport_key
        description: Surrogate key of the destination airport in dim_airport.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: destination_ident
        description: Destination airport identifier, AirStats-conformed.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_ident
      - name: destination_airport_name
        description: Destination airport name.
      - name: distance_km
        description: Great-circle route distance in kilometres.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: distance_km is not null

  - name: dim_flight
    description: >
      Grain is one row per flight schedule (schedule_id) -- see the model SQL comment for why
      this grain was chosen over flight_number. Natural key is schedule_id; surrogate key is
      flight_key. Do not confuse this scheduled-flight identity with a dated flight instance,
      which is fct_flight_operations' grain.
    columns:
      - name: flight_key
        description: Surrogate key, generated from schedule_id.
        tests:
          - not_null
          - unique
      - name: schedule_id
        description: Natural flight-schedule identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_scheduled_flight_segments')
              field: schedule_id
      - name: flight_number
        description: Marketing/operating flight number (1:1 with schedule_id in this dataset).
        tests:
          - not_null
      - name: airline_key
        description: Surrogate key of the operating airline in dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: airline_code
        description: Operating airline.
        tests:
          - not_null
      - name: route_key
        description: Surrogate key of the route in dim_route.
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: route_id
        description: Route this schedule operates.
        tests:
          - not_null
      - name: aircraft_type_key
        description: Surrogate key of the assigned equipment type in dim_aircraft_type.
        tests:
          - not_null
          - relationships:
              to: ref('dim_aircraft_type')
              field: aircraft_type_key
      - name: aircraft_type_code
        description: Equipment type assigned to this schedule.
        tests:
          - not_null
      - name: scheduled_departure_local_time
        description: Scheduled local departure time of day (HH:MM) at the origin airport.
      - name: scheduled_duration_minutes
        description: Scheduled flight duration in minutes.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              row_condition: scheduled_duration_minutes is not null
      - name: operating_days_of_week
        description: Pipe-delimited three-letter day-of-week codes the schedule operates on.

  - name: dim_passenger
    description: >
      Grain is one row per synthetic passenger. Natural key is passenger_id; surrogate key is
      passenger_key. Every attribute is synthetic Milestone 9 generator output -- no real
      individuals are represented (see docs/data_models/airline_synthetic_source_data.md's
      Privacy Statement). A future recruiter-facing mart should avoid exposing name/email/
      date_of_birth directly; this core dimension retains them for source-lineage completeness.
    columns:
      - name: passenger_key
        description: Surrogate key, generated from passenger_id.
        tests:
          - not_null
          - unique
      - name: passenger_id
        description: Natural passenger identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__passengers')
              field: passenger_id
      - name: first_name
        description: Synthetic first name.
      - name: last_name
        description: Synthetic last name.
      - name: date_of_birth
        description: Synthetic date of birth.
      - name: nationality
        description: Synthetic ISO country code.
      - name: email
        description: Synthetic email address on the .invalid reserved test domain.
      - name: loyalty_tier
        description: Synthetic loyalty program tier.
        tests:
          - accepted_values:
              values:
                - none
                - silver
                - gold
                - platinum

  - name: dim_booking_channel
    description: >
      Grain is one row per booking channel. Natural key is booking_channel; surrogate key is
      booking_channel_key. No standalone booking-channel source table exists, so this is derived
      from the distinct values staged in stg_airline__bookings.booking_channel.
    columns:
      - name: booking_channel_key
        description: Surrogate key, generated from booking_channel.
        tests:
          - not_null
          - unique
      - name: booking_channel
        description: Natural booking-channel identifier.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - direct_website
                - mobile_app
                - call_center
                - travel_agent
                - corporate_portal

  - name: dim_fare_class
    description: >
      Grain is one row per fare class. Natural key is fare_class_code; surrogate key is
      fare_class_key. Reuses stg_airline__fare_classes but deliberately excludes its monetary
      columns (base_fare_usd, per_km_usd, change_fee_usd) -- fare/pricing calculations are out of
      scope until Milestone 13 (Products, Services, Prices and Tariffs).
    columns:
      - name: fare_class_key
        description: Surrogate key, generated from fare_class_code.
        tests:
          - not_null
          - unique
      - name: fare_class_code
        description: Natural fare-class identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__fare_classes')
              field: fare_class_code
      - name: cabin
        description: Cabin code for this fare class.
        tests:
          - accepted_values:
              values:
                - Y
                - W
                - C
                - F
      - name: fare_basis_code
        description: Fare basis code for this fare class.
      - name: refundable
        description: Fare-rule attribute; not a monetary value.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: description
        description: Fare class display description.

  - name: dim_cabin
    description: >
      Grain is one row per cabin category. Natural key is cabin; surrogate key is cabin_key.
      Derived from the distinct cabin codes staged in stg_airline__fare_classes. No
      human-readable cabin name is added -- that mapping exists only inside the Milestone 9
      generator's internal Python reference data, not in any staged column (see model SQL
      comment).
    columns:
      - name: cabin_key
        description: Surrogate key, generated from cabin.
        tests:
          - not_null
          - unique
      - name: cabin
        description: Natural cabin-category code.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - Y
                - W
                - C
                - F

  - name: dim_fare_rule
    description: >
      Grain is one row per fare-class rule set. Natural key is fare_rule_id; fare_class_code is
      unique (one rule set per fare class). Surrogate key is fare_rule_key. Rule attributes are
      reference/eligibility data only -- none is applied as a priced charge component in this
      milestone (see model SQL comment for why change_fee_usd is not charged).
    columns:
      - name: fare_rule_key
        description: Surrogate key, generated from fare_rule_id.
        tests:
          - not_null
          - unique
      - name: fare_rule_id
        description: Natural fare-rule identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__fare_rules')
              field: fare_rule_id
      - name: fare_class_key
        description: Foreign key to dim_fare_class.
        tests:
          - not_null
          - relationships:
              to: ref('dim_fare_class')
              field: fare_class_key
      - name: fare_class_code
        description: Fare class this rule set applies to.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__fare_classes')
              field: fare_class_code
      - name: refundable
        description: Boolean normalised from the source 'True'/'False' text.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: change_fee_usd
        description: Illustrative change fee in USD; reference only, not charged in this milestone.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: advance_purchase_days
        description: Minimum advance-purchase requirement in days.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: min_stay_nights
        description: Minimum stay requirement in nights.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_tax
    description: >
      Grain is one row per (country, tax type) -- currently one row per country (a single flat
      "Government Passenger Tax" replicated per country). Natural key is tax_id; surrogate key is
      tax_key. percentage_rate is a fraction applied against a ticket's pre-tax fare; see
      int_tax_calculation for the country-applicability rule.
    columns:
      - name: tax_key
        description: Surrogate key, generated from tax_id.
        tests:
          - not_null
          - unique
      - name: tax_id
        description: Natural tax identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__taxes')
              field: tax_id
      - name: country_code
        description: ISO country code the tax applies to.
        tests:
          - not_null
      - name: tax_code
        description: Tax type code.
      - name: tax_name
        description: Tax display name.
      - name: percentage_rate
        description: Fraction of a ticket's pre-tax (base + distance) fare charged as tax.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: currency_code
        description: Currency the tax's own country denominates amounts in.
        tests:
          - relationships:
              to: ref('stg_airline__currencies')
              field: currency_code

  - name: dim_currency
    description: >
      Grain is one row per currency code. Natural key is currency_code; surrogate key is
      currency_key. Combines stg_airline__currencies with stg_airline__exchange_rates (1:1 join).
      rate_to_usd is a single current rate, not a time series -- see model SQL comment for why no
      FX history is modelled. minor_unit_digits is reference-only; this pricing layer rounds every
      amount to a flat 2 decimal places throughout, matching the Milestone 9 generator's own
      convention (see model SQL comment).
    columns:
      - name: currency_key
        description: Surrogate key, generated from currency_code.
        tests:
          - not_null
          - unique
      - name: currency_code
        description: Natural currency identifier (ISO 4217-style code).
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__currencies')
              field: currency_code
      - name: currency_name
        description: Currency display name.
      - name: minor_unit_digits
        description: Reference-only; not applied dynamically in this pricing layer's rounding.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: rate_to_usd
        description: USD value of one unit of this currency, as of rate_as_of_date.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: rate_as_of_date
        description: The single deterministic date this rate was generated as of.
        tests:
          - not_null

  - name: dim_discount
    description: >
      Grain is one row per discount code. Natural key is discount_code; surrogate key is
      discount_key. discount_type governs how value is interpreted -- see
      int_booking_charge_components for the exact application formula. corporate_account_id
      restricts a CORP-* discount to one corporate account.
    columns:
      - name: discount_key
        description: Surrogate key, generated from discount_code.
        tests:
          - not_null
          - unique
      - name: discount_code
        description: Natural discount identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__discounts')
              field: discount_code
      - name: discount_name
        description: Discount display name.
      - name: discount_type
        description: How value should be interpreted.
        tests:
          - accepted_values:
              values:
                - percentage
                - fixed_amount
      - name: value
        description: >
          Discount magnitude. A fraction (e.g. 0.10) when percentage, or a fixed USD amount when
          fixed_amount.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: corporate_account_id
        description: Corporate account this discount is negotiated for, if any; null otherwise.
        tests:
          - relationships:
              to: ref('stg_airline__corporate_accounts')
              field: corporate_account_id

  - name: dim_service
    description: >
      Grain is one row per sellable ancillary/service catalog entry. Natural key is service_code;
      surrogate key is service_key. category is retained directly on this dimension rather than
      split into a separate dim_ancillary_type -- see model SQL comment for why.
    columns:
      - name: service_key
        description: Surrogate key, generated from service_code.
        tests:
          - not_null
          - unique
      - name: service_code
        description: Natural service identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__services')
              field: service_code
      - name: service_name
        description: Service display name.
      - name: category
        description: Service category (e.g. baggage, seat, meal, lounge, upgrade).
      - name: base_price_usd
        description: Illustrative catalog price in USD, before currency conversion at time of sale.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_product
    description: >
      Grain is one row per sellable fare bundle. Natural key is product_code; surrogate key is
      product_key. A standalone catalog dimension: no Milestone 9 booking/ticket table carries a
      product_code foreign key, so no fact in this milestone joins to dim_product -- see model SQL
      comment.
    columns:
      - name: product_key
        description: Surrogate key, generated from product_code.
        tests:
          - not_null
          - unique
      - name: product_code
        description: Natural product identifier.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__products')
              field: product_code
      - name: product_name
        description: Product display name.
      - name: fare_class_key
        description: Foreign key to dim_fare_class.
        tests:
          - relationships:
              to: ref('dim_fare_class')
              field: fare_class_key
      - name: fare_class_code
        description: Underlying fare class the product bundles.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__fare_classes')
              field: fare_class_code
      - name: included_service_codes
        description: Pipe-delimited service codes included in the bundle, as staged (not parsed).

  - name: dim_payment_method
    description: >
      Grain is one row per payment method. Natural key is method; surrogate key is
      payment_method_key. No standalone source table exists -- derived from the distinct values
      staged in stg_airline__payment_attempts.method and stg_airline__payments.method, reused
      across both fct_payment_attempts and fct_payments.
    columns:
      - name: payment_method_key
        description: Surrogate key, generated from method.
        tests:
          - not_null
          - unique
      - name: method
        description: Natural payment-method identifier.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - card
                - bank_transfer
                - voucher
