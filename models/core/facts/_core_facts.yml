version: 2

models:
  - name: fct_flight_schedule
    description: >
      Grain is one row per scheduled flight service (schedule_id). Natural key is schedule_id.
      Foreign keys: flight_key (dim_flight), airline_key (dim_airline), origin_airport_key and
      destination_airport_key (dim_airport), aircraft_type_key (dim_aircraft_type). Operational
      schedule measures only; no passenger-booking, revenue, or ticketing facts.
    columns:
      - name: schedule_id
        description: Natural flight-schedule identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_scheduled_flight_segments')
              field: schedule_id
      - name: flight_key
        description: Foreign key to dim_flight.
        tests:
          - not_null
          - relationships:
              to: ref('dim_flight')
              field: flight_key
      - name: airline_key
        description: Foreign key to dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: origin_airport_key
        description: Foreign key to dim_airport for the origin.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: destination_airport_key
        description: Foreign key to dim_airport for the destination.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: aircraft_type_key
        description: Foreign key to dim_aircraft_type for the assigned equipment type.
        tests:
          - not_null
          - relationships:
              to: ref('dim_aircraft_type')
              field: aircraft_type_key
      - name: route_id
        description: Natural route identifier, retained for lineage.
      - name: scheduled_departure_local_time
        description: Scheduled local departure time of day (HH:MM) at the origin airport.
      - name: scheduled_duration_minutes
        description: Scheduled flight duration in minutes.
      - name: weekly_operating_day_count
        description: Count of days per week the schedule operates.
      - name: distance_km
        description: Great-circle route distance in kilometres.

  - name: fct_flight_operations
    description: >
      Grain is one row per dated flight instance. Natural key is flight_instance_id. Foreign
      keys: flight_key (dim_flight), airline_key (dim_airline), origin_airport_key and
      destination_airport_key (dim_airport), aircraft_key (dim_aircraft), actual_aircraft_type_key
      (dim_aircraft_type, the type of the aircraft that actually operated the flight).
      passengers_carried and load_factor are populated as of Milestone 12 from completed
      passenger ticket segments (int_passenger_journey_completion); see model SQL comment and
      docs/data_models/airline_booking_ticketing.md for the counting rule. No fare, invoice, or
      revenue data is used.
    columns:
      - name: flight_instance_id
        description: Natural flight-instance identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_operated_flight_segments')
              field: flight_instance_id
      - name: flight_date
        description: Calendar date of the flight occurrence.
        tests:
          - not_null
      - name: flight_key
        description: Foreign key to dim_flight.
        tests:
          - not_null
          - relationships:
              to: ref('dim_flight')
              field: flight_key
      - name: airline_key
        description: Foreign key to dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: origin_airport_key
        description: Foreign key to dim_airport for the origin.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: destination_airport_key
        description: Foreign key to dim_airport for the destination.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: aircraft_key
        description: Foreign key to dim_aircraft for the aircraft that actually operated this instance.
        tests:
          - relationships:
              to: ref('dim_aircraft')
              field: aircraft_key
      - name: actual_aircraft_type_key
        description: Foreign key to dim_aircraft_type for the actual operating equipment type.
        tests:
          - relationships:
              to: ref('dim_aircraft_type')
              field: aircraft_type_key
      - name: scheduled_departure_utc
        description: Scheduled departure timestamp in UTC.
      - name: scheduled_arrival_utc
        description: Scheduled arrival timestamp in UTC.
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= scheduled_departure_utc"
              config:
                where: "scheduled_departure_utc is not null and scheduled_arrival_utc is not null"
      - name: status
        description: Flight-instance status, unchanged from staging.
        tests:
          - accepted_values:
              values:
                - scheduled
                - completed
                - cancelled
      - name: operational_completion_status
        description: >
          Deterministic operational completion category. Source-observed operational signal
          only; does not infer service fulfilment, revenue recognition, or on-time performance.
      - name: is_assigned_aircraft_type_consistent
        description: >
          True when the actual operating aircraft's type matches the schedule's assigned type;
          false when it does not; null when unknown. Both true and false genuinely occur.
      - name: seats_available
        description: Typical seat count of the actual operating equipment type.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              row_condition: seats_available is not null
      - name: passengers_carried
        description: >
          Count of this flight instance's ticket segments with
          journey_completion_status = 'completed' (int_passenger_journey_completion) -- i.e.
          actually flown. Cancelled and not-yet-flown segments are excluded. 0, not null, for
          flight instances with no completed segments (still-scheduled or cancelled flights).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
          - dbt_utils.expression_is_true:
              expression: "<= seats_available"
              config:
                where: "seats_available is not null"
      - name: load_factor
        description: >
          passengers_carried / seats_available, guarded to compute only when seats_available > 0;
          null when seats_available is null or 0.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
              row_condition: load_factor is not null

  - name: fct_bookings
    description: >
      Grain is one row per booking. Natural key is booking_id; surrogate key is booking_key.
      Foreign keys: airline_key (dim_airline), route_key (dim_route),
      booking_channel_key (dim_booking_channel). No fare, invoice, or revenue measures --
      passenger_count and ticket_count are structural counts from int_booking_current_state.
    columns:
      - name: booking_key
        description: Surrogate key, generated from booking_id.
        tests:
          - not_null
          - unique
      - name: booking_id
        description: Natural booking identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_booking_current_state')
              field: booking_id
      - name: booking_reference
        description: Passenger-facing booking reference code.
        tests:
          - not_null
      - name: airline_key
        description: Foreign key to dim_airline.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_key
      - name: route_key
        description: Foreign key to dim_route for the outbound route.
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: trip_type
        description: Trip type.
        tests:
          - accepted_values:
              values:
                - one_way
                - round_trip
      - name: booking_channel_key
        description: Foreign key to dim_booking_channel.
        tests:
          - not_null
          - relationships:
              to: ref('dim_booking_channel')
              field: booking_channel_key
      - name: booking_date_utc
        description: Booking creation timestamp in UTC.
        tests:
          - not_null
      - name: booking_status
        description: Current booking status; see int_booking_current_state for why no history is modelled.
        tests:
          - accepted_values:
              values:
                - confirmed
                - cancelled
      - name: corporate_account_id
        description: Corporate account, if this is a corporate booking; null otherwise. No dim_corporate_account exists yet.
      - name: travel_agent_id
        description: Travel agent, if this booking was made through an agent; null otherwise. No dim_travel_agent exists yet.
      - name: outbound_flight_instance_id
        description: Outbound flight instance.
        tests:
          - not_null
          - relationships:
              to: ref('int_operated_flight_segments')
              field: flight_instance_id
      - name: return_flight_instance_id
        description: Return flight instance for round-trip bookings; null for one-way bookings.
        tests:
          - relationships:
              to: ref('int_operated_flight_segments')
              field: flight_instance_id
      - name: passenger_count
        description: Count of booking_passengers rows for this booking.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: ticket_count
        description: Count of tickets rows for this booking.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: is_cancelled
        description: True when booking_status = 'cancelled'.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: fct_booking_passengers
    description: >
      Grain is one row per booking-passenger association. Natural key is booking_passenger_id;
      surrogate key is booking_passenger_key. Foreign keys: booking_key (fct_bookings, reused
      rather than regenerated -- see model SQL comment), passenger_key (dim_passenger),
      fare_class_key (dim_fare_class), cabin_key (dim_cabin). No fare values.
    columns:
      - name: booking_passenger_key
        description: Surrogate key, generated from booking_passenger_id.
        tests:
          - not_null
          - unique
      - name: booking_passenger_id
        description: Natural booking-passenger association identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_booking_passengers')
              field: booking_passenger_id
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: passenger_key
        description: Foreign key to dim_passenger.
        tests:
          - not_null
          - relationships:
              to: ref('dim_passenger')
              field: passenger_key
      - name: passenger_type
        description: Passenger fare type.
        tests:
          - accepted_values:
              values:
                - adult
                - child
                - infant
      - name: booking_status
        description: Current status of the parent booking.
        tests:
          - accepted_values:
              values:
                - confirmed
                - cancelled
      - name: ticket_status
        description: Status of this passenger's ticket for this booking; null if unresolved.
        tests:
          - accepted_values:
              values:
                - issued
                - cancelled
      - name: fare_class_key
        description: Foreign key to dim_fare_class; null if unresolved.
        tests:
          - relationships:
              to: ref('dim_fare_class')
              field: fare_class_key
      - name: cabin_key
        description: Foreign key to dim_cabin; null if unresolved.
        tests:
          - relationships:
              to: ref('dim_cabin')
              field: cabin_key

  - name: fct_ticket_segments
    description: >
      Grain is one row per ticketed passenger flight segment. Natural key is ticket_segment_id;
      surrogate key is ticket_segment_key. Foreign keys: booking_key (fct_bookings),
      passenger_key (dim_passenger), flight_key (dim_flight), route_key (dim_route),
      origin_airport_key/destination_airport_key (dim_airport), fare_class_key (dim_fare_class),
      cabin_key (dim_cabin). No pricing/revenue values.
    columns:
      - name: ticket_segment_key
        description: Surrogate key, generated from ticket_segment_id.
        tests:
          - not_null
          - unique
      - name: ticket_segment_id
        description: Natural ticket-segment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_ticketed_segments')
              field: ticket_segment_id
      - name: ticket_id
        description: Ticket this segment belongs to.
        tests:
          - not_null
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: passenger_key
        description: Foreign key to dim_passenger.
        tests:
          - not_null
          - relationships:
              to: ref('dim_passenger')
              field: passenger_key
      - name: flight_key
        description: Foreign key to dim_flight.
        tests:
          - not_null
          - relationships:
              to: ref('dim_flight')
              field: flight_key
      - name: route_key
        description: Foreign key to dim_route.
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: origin_airport_key
        description: Foreign key to dim_airport for the origin.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: destination_airport_key
        description: Foreign key to dim_airport for the destination.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: fare_class_key
        description: Foreign key to dim_fare_class; null if unresolved.
        tests:
          - relationships:
              to: ref('dim_fare_class')
              field: fare_class_key
      - name: cabin_key
        description: Foreign key to dim_cabin; null if unresolved.
        tests:
          - relationships:
              to: ref('dim_cabin')
              field: cabin_key
      - name: ticket_status
        description: Status of the parent ticket.
        tests:
          - accepted_values:
              values:
                - issued
                - cancelled
      - name: segment_status
        description: >
          Segment status. One row carries a deliberately injected controlled exception
          (completed_segment_without_recognised_revenue_precursor); do not filter it out.
        tests:
          - accepted_values:
              values:
                - confirmed
                - flown
                - cancelled
      - name: flight_instance_status
        description: Status of the linked flight instance, unchanged from the Milestone 11 layer.
        tests:
          - accepted_values:
              values:
                - scheduled
                - completed
                - cancelled
      - name: operational_completion_status
        description: Deterministic flight-instance completion category from the Milestone 11 layer.

  - name: fct_passenger_journeys
    description: >
      Grain is one row per passenger flight segment / journey leg (ticket_segment_id) -- the same
      grain as fct_ticket_segments, but deliberately narrower and focused only on
      journey-completion semantics; see model SQL comment for why multi-leg journeys are not
      collapsed into one row. Surrogate key is passenger_journey_key. Foreign keys: booking_key
      (fct_bookings), passenger_key (dim_passenger), flight_key (dim_flight),
      origin_airport_key/destination_airport_key (dim_airport). No revenue-fulfilment inference.
    columns:
      - name: passenger_journey_key
        description: Surrogate key, generated from ticket_segment_id.
        tests:
          - not_null
          - unique
      - name: ticket_segment_id
        description: Natural ticket-segment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_passenger_journey_completion')
              field: ticket_segment_id
      - name: ticket_id
        description: Ticket this journey leg belongs to.
        tests:
          - not_null
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: passenger_key
        description: Foreign key to dim_passenger.
        tests:
          - not_null
          - relationships:
              to: ref('dim_passenger')
              field: passenger_key
      - name: flight_key
        description: Foreign key to dim_flight.
        tests:
          - not_null
          - relationships:
              to: ref('dim_flight')
              field: flight_key
      - name: origin_airport_key
        description: Foreign key to dim_airport for the origin.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: destination_airport_key
        description: Foreign key to dim_airport for the destination.
        tests:
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: journey_completion_status
        description: >
          Deterministic completion category; see int_passenger_journey_completion for the full
          derivation rule.
        tests:
          - accepted_values:
              values:
                - scheduled
                - completed
                - cancelled
                - not_flown
                - other
      - name: is_completed
        description: True when journey_completion_status = 'completed'.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_cancelled
        description: True when journey_completion_status = 'cancelled'.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: fct_pricing_events
    description: >
      Grain is one row per priced charge component. Natural key is component_key_natural;
      surrogate key is charge_component_key. Foreign keys: booking_key (fct_bookings), passenger_key
      (dim_passenger), fare_class_key (dim_fare_class), route_key (dim_route), origin_airport_key
      (dim_airport), tax_key (dim_tax), service_key (dim_service), discount_key (dim_discount),
      currency_key (dim_currency) -- each populated only for the component_type it applies to; see
      int_booking_charge_components and docs/data_models/airline_pricing_tariffs.md for the full
      grain/sign-convention rationale. No invoice, payment, refund, adjustment, or
      revenue-recognition field exists on this fact; those remain out of scope until Milestone 14+.
    columns:
      - name: charge_component_key
        description: Surrogate key, generated from component_key_natural.
        tests:
          - not_null
          - unique
      - name: component_key_natural
        description: Deterministic natural key and grain key.
        tests:
          - not_null
          - unique
      - name: component_type
        description: One of the six charge-component types this milestone models.
        tests:
          - not_null
          - accepted_values:
              values:
                - base_fare
                - distance_fare
                - tax
                - airport_fee
                - ancillary
                - discount
      - name: charge_scope
        description: Whether this component is priced per ticket or per booking.
        tests:
          - not_null
          - accepted_values:
              values:
                - ticket
                - booking
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: ticket_id
        description: Ticket this component belongs to; null only for booking-scoped discount rows.
        tests:
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: passenger_key
        description: Foreign key to dim_passenger; null only for booking-scoped discount rows.
        tests:
          - relationships:
              to: ref('dim_passenger')
              field: passenger_key
      - name: currency_key
        description: Foreign key to dim_currency for the currency amount is denominated in.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: amount
        description: >
          Signed amount in currency (the booking's own currency). Positive for base_fare/
          distance_fare/tax/airport_fee/ancillary; negative (or zero) for discount. Summing amount
          for a booking_id yields that booking's net payable total without recalculating pricing.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                where: "component_type != 'discount'"
          - dbt_utils.expression_is_true:
              expression: "<= 0"
              config:
                where: "component_type = 'discount'"
      - name: amount_usd
        description: The same amount re-expressed in USD, for currency-independent comparison.
      - name: fare_class_key
        description: Foreign key to dim_fare_class; populated only for base_fare/distance_fare rows.
        tests:
          - relationships:
              to: ref('dim_fare_class')
              field: fare_class_key
      - name: route_key
        description: Foreign key to dim_route; populated only for base_fare/distance_fare rows.
        tests:
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: origin_airport_key
        description: >
          Foreign key to dim_airport for the departure airport; populated for base_fare/
          distance_fare/tax/airport_fee rows.
        tests:
          - relationships:
              to: ref('dim_airport')
              field: airport_key
      - name: tax_key
        description: Foreign key to dim_tax; populated only for tax rows.
        tests:
          - relationships:
              to: ref('dim_tax')
              field: tax_key
      - name: service_key
        description: Foreign key to dim_service; populated only for ancillary rows.
        tests:
          - relationships:
              to: ref('dim_service')
              field: service_key
      - name: discount_key
        description: Foreign key to dim_discount; populated only for discount rows.
        tests:
          - relationships:
              to: ref('dim_discount')
              field: discount_key

  - name: fct_invoices
    description: >
      Grain is one row per invoice. Natural key is invoice_id; surrogate key is invoice_key.
      Foreign keys: booking_key (fct_bookings), currency_key (dim_currency). Reuses
      int_invoice_calculation (arithmetic), int_invoice_status (current-state status),
      int_payment_allocation (Milestone 15, payment aggregation), int_refund_allocation, and
      int_adjustment_allocation (Milestone 16) rather than re-deriving any of them.
      amount_collected/payment_count and refund_count/refund_amount/adjustment_count/
      net_adjustment_amount are provisional financial-movement measures, NOT an outstanding-balance
      calculation -- see model SQL comment. No recognised-revenue field exists on this fact; that
      remains out of scope until Milestone 17+. booking_id is deliberately not unique-tested: the
      duplicate_invoice controlled exception produces two invoice_id rows for the same booking_id,
      preserved unchanged -- see docs/data_models/airline_invoices.md.
    columns:
      - name: invoice_key
        description: Surrogate key, generated from invoice_id.
        tests:
          - not_null
          - unique
      - name: invoice_id
        description: Natural invoice identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__invoices')
              field: invoice_id
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: bill_to_type
        description: Who the invoice is billed to.
        tests:
          - accepted_values:
              values:
                - passenger
                - corporate
                - travel_agent
      - name: status
        description: Current invoice status, unchanged from source.
        tests:
          - accepted_values:
              values:
                - issued
                - paid
                - refunded
                - cancelled
      - name: is_cancelled
        description: True when status = 'cancelled'.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: source_invoice_total
        description: invoices.total_amount, unchanged from source. Never overwritten.
      - name: line_count
        description: Count of this invoice's fct_invoice_lines rows.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: calculated_invoice_line_total
        description: sum(invoice line amounts) for this invoice, using the actual sign convention.
        tests:
          - not_null
      - name: invoice_total_variance
        description: >
          source_invoice_total - calculated_invoice_line_total. Nonzero for the deliberately
          injected missing_invoice_line, incorrect_fare, and completed_segment_without_recognised_
          revenue_precursor controlled exceptions; not repaired or classified here.
        tests:
          - not_null
      - name: payment_count
        description: Count of fct_payments rows matched to this invoice_id (Milestone 15).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: amount_collected
        description: >
          sum(int_payment_allocation.allocated_amount) across every payment matched to this
          invoice. Provisional -- NOT a final outstanding_balance. See model SQL comment.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: refund_count
        description: Count of fct_refunds rows matched to this invoice_id (Milestone 16).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: refund_amount
        description: >
          sum(int_refund_allocation.refund_amount) across every refund matched to this invoice,
          unmodified from source (including the refund_greater_than_collected_amount exception's
          inflated value). Provisional -- NOT a final outstanding_balance. See model SQL comment.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: adjustment_count
        description: Count of fct_adjustments rows matched to this invoice_id (Milestone 16).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: net_adjustment_amount
        description: >
          sum(int_adjustment_allocation.amount) across every adjustment matched to this invoice,
          using the actual staged sign convention (credit = negative). Provisional -- NOT a final
          outstanding_balance. See model SQL comment.
        tests:
          - not_null

  - name: fct_invoice_lines
    description: >
      Grain is one row per invoice line. Natural key is invoice_line_id; surrogate key is
      invoice_line_key. Foreign keys: invoice_key (fct_invoices), booking_key (fct_bookings),
      currency_key (dim_currency). Reuses int_invoice_line_validation (structural validation) and
      int_invoice_charge_comparison (pricing-vs-invoice evidence). Payment-level detail lives on
      fct_payments (Milestone 15) and refund/adjustment detail on fct_refunds/fct_adjustments
      (Milestone 16), not here; no revenue field exists on this fact -- that remains out of scope
      until Milestone 17+.
    columns:
      - name: invoice_line_key
        description: Surrogate key, generated from invoice_line_id.
        tests:
          - not_null
          - unique
      - name: invoice_line_id
        description: Natural invoice-line identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__invoice_lines')
              field: invoice_line_id
      - name: invoice_key
        description: Foreign key to fct_invoices.
        tests:
          - not_null
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: ticket_id
        description: Ticket this line relates to; null for booking-level discount lines.
        tests:
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: line_type
        description: Type of charge component, unchanged from source.
        tests:
          - not_null
          - accepted_values:
              values:
                - base_fare
                - tax
                - airport_fee
                - ancillary
                - discount
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: amount
        description: Source line amount, unchanged. One row carries the incorrect_fare exception.
        tests:
          - not_null
      - name: has_invoice_parent
        description: Validation signal -- true when invoice_id resolves to a real invoice.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_supported_line_type
        description: Validation signal -- true when line_type is one of the five known types.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: expected_pricing_component_available
        description: >
          Validation signal -- true when a matching fct_pricing_events component exists for this
          line. Not a billing-exception classification.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: expected_amount
        description: >
          Sum of fct_pricing_events.amount matching this line's (ticket/booking, line_type,
          reference_code); null when no matching pricing component exists.
      - name: pricing_variance_amount
        description: >
          expected-vs-invoiced variance for this line's comparable_line_type bucket (see
          int_invoice_charge_comparison); positive means the invoice charged more than expected.
          Not a billing-exception classification.

  - name: fct_payment_attempts
    description: >
      Grain is one row per payment attempt. Natural key is payment_attempt_id; surrogate key is
      payment_attempt_key. Foreign keys: invoice_key (fct_invoices), booking_key (fct_bookings),
      payment_method_key (dim_payment_method), currency_key (dim_currency). Reuses
      int_payment_attempt_classification. No refund or revenue-recognition field exists on this
      fact; those remain out of scope until Milestone 16+.
    columns:
      - name: payment_attempt_key
        description: Surrogate key, generated from payment_attempt_id.
        tests:
          - not_null
          - unique
      - name: payment_attempt_id
        description: Natural payment-attempt identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__payment_attempts')
              field: payment_attempt_id
      - name: invoice_key
        description: Foreign key to fct_invoices.
        tests:
          - not_null
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: payment_method_key
        description: Foreign key to dim_payment_method.
        tests:
          - relationships:
              to: ref('dim_payment_method')
              field: payment_method_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: amount
        description: Amount attempted.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: result
        description: Outcome of the attempt, unchanged from source.
        tests:
          - accepted_values:
              values:
                - success
                - failed
      - name: attempt_classification
        description: Deterministic classification derived from result.
        tests:
          - not_null
          - accepted_values:
              values:
                - successful
                - failed
                - other

  - name: fct_payments
    description: >
      Grain is one row per successful payment transaction. Natural key is payment_id; surrogate
      key is payment_key. Foreign keys: invoice_key (fct_invoices, null for an unmatched payment),
      booking_key (fct_bookings, null for an unmatched payment), payment_method_key
      (dim_payment_method), currency_key (dim_currency). Reuses int_payment_allocation (which
      reuses int_invoice_payment_matching). Refund detail lives on fct_refunds (Milestone 16),
      joinable via payment_id, not duplicated here; no revenue-recognition field exists on this
      fact -- that remains out of scope until Milestone 17+. The deliberately injected
      payment_without_invoice controlled exception (see docs/data_models/airline_synthetic_
      exception_catalogue.md) surfaces here with has_invoice_match = false and null invoice_key/
      booking_key -- preserved, never repaired or dropped.
    columns:
      - name: payment_key
        description: Surrogate key, generated from payment_id.
        tests:
          - not_null
          - unique
      - name: payment_id
        description: Natural payment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__payments')
              field: payment_id
      - name: invoice_key
        description: Foreign key to fct_invoices; null for an unmatched (payment_without_invoice) payment.
        tests:
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: booking_key
        description: Foreign key to fct_bookings; null for an unmatched payment.
        tests:
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: payment_method_key
        description: Foreign key to dim_payment_method.
        tests:
          - relationships:
              to: ref('dim_payment_method')
              field: payment_method_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: payment_amount
        description: Amount collected, unchanged from source.
        tests:
          - not_null
      - name: allocated_amount
        description: least(payment_amount, invoice total_amount) when matched, else 0.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
          - dbt_utils.expression_is_true:
              expression: "<= payment_amount"
      - name: unallocated_amount
        description: payment_amount - allocated_amount.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: allocation_status
        description: Allocation status of the payment against its invoice, unchanged from source.
        tests:
          - accepted_values:
              values:
                - fully_allocated
                - overpaid_unallocated
                - unallocated
      - name: has_invoice_match
        description: True when invoice_id resolves to a real invoice.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: >
          True when currency equals invoice_currency; null when there is no invoice to compare
          against.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: payment_delay_days
        description: >
          payment_datetime_utc - invoice_date_utc, in days; null when unmatched. No fixed "late"
          threshold is defined -- see docs/data_models/airline_payments.md.

  - name: fct_refunds
    description: >
      Grain is one row per refund transaction. Natural key is refund_id; surrogate key is
      refund_key. Foreign keys: payment_key (fct_payments), invoice_key (fct_invoices), booking_key
      (fct_bookings), currency_key (dim_currency). Reuses int_refund_allocation. No
      revenue-reversal field exists on this fact -- that remains out of scope until Milestone 17+.
    columns:
      - name: refund_key
        description: Surrogate key, generated from refund_id.
        tests:
          - not_null
          - unique
      - name: refund_id
        description: Natural refund identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__refunds')
              field: refund_id
      - name: invoice_key
        description: Foreign key to fct_invoices.
        tests:
          - not_null
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: status
        description: Refund status, unchanged from source.
        tests:
          - accepted_values:
              values:
                - issued
                - pending
      - name: refund_amount
        description: >
          Refund amount, unchanged from source. One row carries the deliberately injected
          refund_greater_than_collected_amount controlled exception.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: refund_limit_variance
        description: >
          refund_amount - refundable_amount_reference. Positive means the refund exceeds the
          amount collected on its matched payment. Calculation evidence only, not a
          billing-exception classification.
      - name: has_payment_match
        description: True when payment_id resolves to a real payment.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: >
          True when currency equals the matched payment's currency; null when unmatched.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: fct_adjustments
    description: >
      Grain is one row per adjustment. Natural key is adjustment_id; surrogate key is
      adjustment_key. Foreign keys: invoice_key (fct_invoices, null for an unmatched adjustment),
      booking_key (fct_bookings, null for an unmatched adjustment), currency_key (dim_currency).
      Reuses int_adjustment_allocation. No revenue-recognition field exists on this fact -- that
      remains out of scope until Milestone 17+. The deliberately injected invalid_adjustment
      controlled exception (see docs/data_models/airline_synthetic_exception_catalogue.md)
      surfaces here with has_invoice_match = false, null invoice_key/booking_key, and
      has_expected_sign_for_type = false -- preserved, never repaired or dropped.
    columns:
      - name: adjustment_key
        description: Surrogate key, generated from adjustment_id.
        tests:
          - not_null
          - unique
      - name: adjustment_id
        description: Natural adjustment identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__adjustments')
              field: adjustment_id
      - name: invoice_key
        description: Foreign key to fct_invoices; null for an unmatched (invalid_adjustment) row.
        tests:
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: booking_key
        description: Foreign key to fct_bookings; null for an unmatched adjustment.
        tests:
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: adjustment_type
        description: Adjustment direction, unchanged from source.
        tests:
          - accepted_values:
              values:
                - credit
                - debit
      - name: amount
        description: >
          Adjustment amount, unchanged from source. Sign convention: credit = negative (decreases
          amount due); debit = positive. See docs/data_models/airline_refunds_adjustments.md.
        tests:
          - not_null
      - name: has_invoice_match
        description: True when invoice_id resolves to a real invoice.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_supported_adjustment_type
        description: True when adjustment_type is one of the two known values.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: True when currency equals the matched invoice's currency; null when unmatched.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_expected_sign_for_type
        description: >
          True when a 'credit' adjustment's amount is <= 0, or a 'debit' adjustment's amount is
          >= 0. False for the deliberately injected invalid_adjustment exception. Structural
          evidence only, not a billing-exception classification.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: fct_credit_notes
    description: >
      Grain is one row per credit note. Natural key is credit_note_id; surrogate key is
      credit_note_key. Foreign keys: invoice_key (fct_invoices), refund_key (fct_refunds, null when
      unlinked), adjustment_key (fct_adjustments, null in the current dataset -- see model SQL
      comment), currency_key (dim_currency). Reuses int_credit_note_application. Implemented as a
      standalone fact, not merged into fct_refunds, because a credit note is its own distinct
      document type with its own natural key and status lifecycle -- see model SQL comment.
    columns:
      - name: credit_note_key
        description: Surrogate key, generated from credit_note_id.
        tests:
          - not_null
          - unique
      - name: credit_note_id
        description: Natural credit-note identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_airline__credit_notes')
              field: credit_note_id
      - name: invoice_key
        description: Foreign key to fct_invoices.
        tests:
          - not_null
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: refund_key
        description: Foreign key to fct_refunds; null when this credit note is not linked to a refund.
        tests:
          - relationships:
              to: ref('fct_refunds')
              field: refund_key
      - name: adjustment_key
        description: >
          Foreign key to fct_adjustments; null when this credit note is not linked to an
          adjustment (always null in the current dataset).
        tests:
          - relationships:
              to: ref('fct_adjustments')
              field: adjustment_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: status
        description: Credit-note status, unchanged from source.
        tests:
          - accepted_values:
              values:
                - issued
      - name: amount
        description: Credit-note amount, unchanged from source.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: has_refund_link
        description: True when refund_id is populated. Always true in the current dataset.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: has_adjustment_link
        description: True when adjustment_id is populated. Always false in the current dataset.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currency_match
        description: True when currency equals the matched invoice's currency; null when unmatched.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false

  - name: fct_revenue
    description: >
      Grain is one row per recognised revenue event. Natural key is (event_type,
      source_event_id); surrogate key is revenue_event_key. A UNION ALL of four event types --
      ticket_revenue, ancillary_revenue, refund_reversal, revenue_adjustment -- reusing
      int_ticket_revenue_recognition, int_ancillary_revenue_recognition,
      int_refund_revenue_reversal, and int_revenue_adjustments rather than re-deriving any of
      them. Every ticket and ancillary sale produces a row regardless of whether it was actually
      recognised (gross_recognised_amount may be 0) -- see model SQL comment. No invoice_id,
      payment_id, outstanding-balance, or billing-exception field exists on this fact; those
      remain out of scope until Milestone 18+.
    columns:
      - name: revenue_event_key
        description: Surrogate key, generated from (event_type, source_event_id).
        tests:
          - not_null
          - unique
      - name: event_type
        description: One of the four event types this milestone models.
        tests:
          - not_null
          - accepted_values:
              values:
                - ticket_revenue
                - ancillary_revenue
                - refund_reversal
                - revenue_adjustment
      - name: source_event_id
        description: >
          The originating ticket_id / ancillary_service_id / refund_id / adjustment_id, depending
          on event_type.
        tests:
          - not_null
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: ticket_id
        description: >
          Populated for ticket_revenue/ancillary_revenue rows only; null for the booking-scoped
          refund_reversal/revenue_adjustment event types.
        tests:
          - relationships:
              to: ref('stg_airline__tickets')
              field: ticket_id
      - name: passenger_key
        description: Foreign key to dim_passenger; populated for ticket_revenue/ancillary_revenue rows only.
        tests:
          - relationships:
              to: ref('dim_passenger')
              field: passenger_key
      - name: route_key
        description: >
          Foreign key to dim_route; populated only for ticket_revenue rows, via the booking's
          outbound route (Milestone 13 convention -- no single flight exists for a round-trip
          ticket).
        tests:
          - relationships:
              to: ref('dim_route')
              field: route_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: gross_recognised_amount
        description: Positive new recognition amount; 0 when ineligible/unfulfilled. Never negative.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: reversal_or_adjustment_amount
        description: >
          <= 0 for refund_reversal rows; carries the adjustment's own native sign for
          revenue_adjustment rows; always 0 for ticket_revenue/ancillary_revenue rows.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "<= 0"
              config:
                where: "event_type = 'refund_reversal'"
          - dbt_utils.expression_is_true:
              expression: "= 0"
              config:
                where: "event_type in ('ticket_revenue', 'ancillary_revenue')"
      - name: net_recognised_amount
        description: gross_recognised_amount + reversal_or_adjustment_amount.
        tests:
          - not_null

  - name: fct_outstanding_balances
    description: >
      Grain is one row per invoice. Natural key is invoice_id; surrogate key is invoice_key.
      Foreign keys: booking_key (fct_bookings), currency_key (dim_currency). Reuses
      int_outstanding_balance. No reconciliation or commercial-mart field exists on this fact;
      those remain out of scope until Milestone 19+.
    columns:
      - name: invoice_key
        description: Foreign key to fct_invoices, reused as this fact's own surrogate key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_invoices')
              field: invoice_key
      - name: invoice_id
        description: Natural invoice identifier and grain key.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_invoices')
              field: invoice_id
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - not_null
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: currency_key
        description: Foreign key to dim_currency.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key
      - name: outstanding_balance
        description: >
          source_invoice_total - amount_collected + refund_amount + net_adjustment_amount.
          Positive = amount still due; zero = settled; negative = over-settled. Never clamped to
          zero -- see docs/data_models/airline_outstanding_balances_exceptions.md.
        tests:
          - not_null
      - name: settlement_status
        description: Derived neutrally from the sign of outstanding_balance only.
        tests:
          - not_null
          - accepted_values:
              values:
                - outstanding
                - settled
                - over_settled

  - name: fct_billing_exceptions
    description: >
      Grain is one row per detected billing/revenue exception. Natural key is (exception_type,
      source_record_id); surrogate key is exception_key. Foreign keys: booking_key
      (fct_bookings), invoice_key (fct_invoices), payment_key (fct_payments), refund_key
      (fct_refunds), adjustment_key (fct_adjustments), route_key (dim_route), airport_key
      (dim_airport), currency_key (dim_currency) -- each populated only where that exception_type's
      detection rule resolves it (see int_billing_exceptions). status/assigned_owner/
      resolution_date/root_cause/remediation_action are deterministic current-state workflow
      placeholders (status = 'open' for every row; the rest null) -- no investigation ever
      occurred in this synthetic dataset, so none is fabricated. See
      docs/data_models/airline_outstanding_balances_exceptions.md for the full taxonomy, severity
      rule, and financial-value-at-risk convention.
    columns:
      - name: exception_key
        description: Surrogate key, generated from (exception_type, source_record_id).
        tests:
          - not_null
          - unique
      - name: exception_type
        description: One of the fourteen detection rules this milestone implements.
        tests:
          - not_null
          - accepted_values:
              values:
                - duplicate_invoice
                - failed_payment_after_ticket_issue
                - unallocated_payment
                - payment_without_invoice
                - incorrect_fare
                - currency_mismatch
                - refund_greater_than_collected_amount
                - invalid_adjustment
                - cancelled_flight_without_refund
                - completed_segment_without_recognised_revenue_precursor
                - ancillary_sold_but_not_fulfilled
                - ancillary_fulfilled_but_not_billed
                - missing_invoice_line
                - late_arriving_payment
      - name: source_record_id
        description: Deterministic natural identifier of the affected record(s) for this exception_type.
        tests:
          - not_null
      - name: booking_key
        description: Foreign key to fct_bookings.
        tests:
          - relationships:
              to: ref('fct_bookings')
              field: booking_key
      - name: financial_value_at_risk_amount
        description: >
          Non-negative absolute monetary exposure; always 0 for late_arriving_payment.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: severity
        description: >
          Deterministic exception_type-driven tier, escalated one level when
          financial_value_at_risk_amount >= 1000. Never randomness.
        tests:
          - not_null
          - accepted_values:
              values:
                - critical
                - high
                - medium
                - low
      - name: status
        description: >
          Deterministic current-state workflow placeholder; always 'open' for every detected
          exception. Not a claim that any triage has occurred.
        tests:
          - not_null
          - accepted_values:
              values:
                - open
      - name: assigned_owner
        description: >
          Always null -- no deterministic synthetic workflow-assignment data exists in the
          Milestone 9 specification; never fabricated.
      - name: resolution_date
        description: Always null -- no exception has been resolved; this dataset has no such history.
      - name: root_cause
        description: >
          Always null -- distinct from rule_description (int_billing_exceptions), which states
          which detection rule fired, not a human investigation's finding.
      - name: remediation_action
        description: Always null -- no remediation workflow has occurred.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - exception_type
            - source_record_id

  - name: fct_reconciliation_controls
    description: >
      Grain is one row per reconciliation control per as-of period. Natural key is
      (control_id, as_of_date); surrogate key is control_key. Reuses int_financial_control_summary
      unchanged -- no new comparison or calculation. See model SQL comment for why this milestone's
      final control contract is promoted to core while int_billing_exception_control_summary and
      int_month_end_financial_assurance remain intermediate-only reporting models.
    columns:
      - name: control_key
        description: Surrogate key, generated from (control_id, as_of_date).
        tests:
          - not_null
          - unique
      - name: control_id
        description: Deterministic natural identifier, control_domain.control_name.
        tests:
          - not_null
      - name: control_domain
        description: Which business area this control covers.
        tests:
          - not_null
          - accepted_values:
              values: [booking, ticket, flight_operations, invoice, payment, refund, revenue_bridge]
      - name: control_status
        description: >
          pass = exact/tolerance-bounded agreement; fail = disagreement; warning = informational,
          known, non-ETL divergence; not_applicable = no source-side comparison exists for this
          row.
        tests:
          - not_null
          - accepted_values:
              values: [pass, fail, warning, not_applicable]
      - name: as_of_date
        description: The dataset's fixed synthetic as-of date, never wall-clock-dependent.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - control_id
            - as_of_date
