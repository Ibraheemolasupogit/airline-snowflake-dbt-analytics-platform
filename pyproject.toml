[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-snowflake-dbt-analytics-platform"
version = "0.1.0"
description = "Snowflake and dbt analytics-engineering platform for airline operations and commercial analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Repository Maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: SQL",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
